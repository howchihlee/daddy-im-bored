<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b2340">
  <title>Daddy, I'm Bored!｜遊戲樂園</title>
  <style>
    :root {
      --ink: #29304a;
      --purple: #6c63ff;
      --purple-dark: #4e46d8;
      --yellow: #ffd85a;
      --pink: #ff7aa8;
      --mint: #62d9b7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Arial Rounded MT Bold", "Nunito", "Noto Sans TC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 8% 14%, rgba(255, 216, 90, .9) 0 5px, transparent 6px),
        radial-gradient(circle at 92% 20%, rgba(255, 122, 168, .65) 0 7px, transparent 8px),
        radial-gradient(circle at 84% 84%, rgba(98, 217, 183, .8) 0 6px, transparent 7px),
        linear-gradient(145deg, #1b2340 0%, #2a2150 50%, #14263a 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .28;
    }

    body::before { top: -110px; left: -80px; background: var(--yellow); }
    body::after { right: -90px; bottom: -120px; background: var(--pink); }

    .page {
      width: min(520px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(42px, 8vw, 80px) 0 56px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      line-height: .96;
      letter-spacing: -.055em;
      color: #9d96ff;
      text-shadow: 0 4px 0 rgba(0, 0, 0, .45), 0 7px 0 rgba(108, 99, 255, .2);
    }

    .intro {
      margin: 18px auto 34px;
      color: #bcc4e0;
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      font-weight: 700;
      line-height: 1.6;
    }

    .games {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .game-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      color: #f1f4ff;
      text-decoration: none;
      font-size: clamp(1.15rem, 3vw, 1.4rem);
      font-weight: 900;
      letter-spacing: .04em;
      background: rgba(30, 39, 64, .94);
      border: 3px solid #4a5680;
      border-radius: 22px;
      box-shadow: 0 6px 0 rgba(78, 70, 216, .22), 0 14px 28px rgba(53, 48, 112, .16);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .game-link:hover,
    .game-link:focus-visible {
      transform: translateY(-3px);
      border-color: var(--purple);
      box-shadow: 0 9px 0 rgba(78, 70, 216, .28), 0 18px 32px rgba(53, 48, 112, .22);
      outline: none;
    }

    .game-link:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0 rgba(78, 70, 216, .22);
    }

    .game-logo {
      flex: none;
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .3));
    }

    .game-name { flex: 1; text-align: left; }

    .game-link::after {
      content: "▶";
      color: var(--yellow);
      font-size: .85em;
    }

    @media (prefers-reduced-motion: reduce) {
      .game-link { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Daddy, I’m Bored!</h1>
    <p class="intro">小孩無聊，老爸製作。</p>

    <nav class="games" aria-label="所有遊戲">
      <a class="game-link" href="games/WordKing/">
        <img class="game-logo" src="games/WordKing/assets/logo.svg" alt="">
        <span class="game-name">認字王</span>
      </a>
      <a class="game-link" href="games/Bopomofo/">
        <img class="game-logo" src="games/Bopomofo/assets/logo.svg" alt="">
        <span class="game-name">注音王</span>
      </a>
      <a class="game-link" href="games/ISPY/">
        <img class="game-logo" src="games/ISPY/assets/logo.svg" alt="">
        <span class="game-name">注音王</span>
      </a>
      <a class="game-link" href="games/hatchu/">
        <img class="game-logo" src="games/hatchu/assets/logo.svg" alt="">
        <span class="game-name">孵蛋王</span>
      </a>
      <a class="game-link" href="games/whack-a-bo/">
        <img class="game-logo" src="games/whack-a-bo/assets/logo.svg" alt="">
        <span class="game-name">地鼠王</span>
      </a>
    </nav>

  </main>
</body>
</html>

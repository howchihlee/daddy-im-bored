<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b2340">
  <title>Daddy, I'm Bored!｜遊戲樂園</title>
  <style>
    :root {
      --ink: #29304a;
      --purple: #6c63ff;
      --purple-dark: #4e46d8;
      --paper: #fffdf7;
      --yellow: #ffd85a;
      --pink: #ff7aa8;
      --mint: #62d9b7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Arial Rounded MT Bold", "Nunito", "Noto Sans TC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 8% 14%, rgba(255, 216, 90, .9) 0 5px, transparent 6px),
        radial-gradient(circle at 92% 20%, rgba(255, 122, 168, .65) 0 7px, transparent 8px),
        radial-gradient(circle at 84% 84%, rgba(98, 217, 183, .8) 0 6px, transparent 7px),
        linear-gradient(145deg, #1b2340 0%, #2a2150 50%, #14263a 100%);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .28;
    }

    body::before { top: -110px; left: -80px; background: var(--yellow); }
    body::after { right: -90px; bottom: -120px; background: var(--pink); }

    .page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(42px, 8vw, 88px) 0 56px;
      text-align: center;
    }


    h1 {
      margin: 0;
      font-size: clamp(2.65rem, 8vw, 5.5rem);
      line-height: .96;
      letter-spacing: -.055em;
      color: #9d96ff;
      text-shadow: 0 5px 0 rgba(0, 0, 0, .45), 0 9px 0 rgba(108, 99, 255, .2);
    }

    .intro {
      max-width: 600px;
      margin: 24px auto 38px;
      color: #bcc4e0;
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      font-weight: 700;
      line-height: 1.6;
    }

    .games {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 26px;
      flex-wrap: wrap;
    }

    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(310px, 100%);
      min-height: 330px;
      padding: 20px;
      color: #f1f4ff;
      text-decoration: none;
      background: rgba(30, 39, 64, .94);
      border: 4px solid #4a5680;
      border-radius: 32px;
      box-shadow: 0 12px 0 rgba(78, 70, 216, .16), 0 22px 45px rgba(53, 48, 112, .14);
      transition: transform .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .game-card::before {
      content: "★";
      position: absolute;
      top: -17px;
      right: 20px;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      color: #7b5500;
      background: var(--yellow);
      border: 3px solid #fff;
      border-radius: 50%;
      transform: rotate(9deg);
      box-shadow: 0 4px 0 rgba(123, 85, 0, .18);
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-8px) rotate(-1deg);
      box-shadow: 0 16px 0 rgba(78, 70, 216, .16), 0 28px 50px rgba(53, 48, 112, .2);
      outline: none;
    }

    .logo-wrap {
      display: grid;
      place-items: center;
      min-height: 205px;
      padding: 16px;
      border-radius: 23px;
      background: linear-gradient(145deg, #223050, #2b2450);
      overflow: hidden;
    }

    .game-logo {
      display: block;
      width: 100%;
      height: 175px;
      object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(41, 48, 74, .15));
    }

    .play-label {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 19px;
      padding: 13px 18px;
      color: white;
      background: var(--purple);
      border-radius: 18px;
      box-shadow: 0 6px 0 var(--purple-dark);
      font-size: 1.15rem;
      font-weight: 900;
    }

    .game-card:active { transform: translateY(3px); }
    .game-card:active .play-label { box-shadow: 0 3px 0 var(--purple-dark); }


    @media (prefers-reduced-motion: reduce) {
      .game-card { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Daddy, I’m Bored!</h1>
    <p class="intro">小孩無聊，老爸製作。</p>

    <nav class="games" aria-label="所有遊戲">
      <a class="game-card" href="games/WordKing/" aria-label="開始玩認字王">
        <span class="logo-wrap">
          <img class="game-logo" src="games/WordKing/assets/logo.png" alt="認字王">
        </span>
        <span class="play-label">開始玩 <span aria-hidden="true">▶</span></span>
      </a>
      <a class="game-card" href="games/Bopomofo/" aria-label="開始玩注音王">
        <span class="logo-wrap">
          <img class="game-logo" src="games/Bopomofo/assets/logo.png" alt="注音王">
        </span>
        <span class="play-label">開始玩 <span aria-hidden="true">▶</span></span>
      </a>
      <a class="game-card" href="games/ISPY/" aria-label="開始玩注音小偵探">
        <span class="logo-wrap">
          <img class="game-logo" src="games/ISPY/assets/logo.png" alt="注音小偵探">
        </span>
        <span class="play-label">開始玩 <span aria-hidden="true">▶</span></span>
      </a>
      <a class="game-card" href="games/hatchu/" aria-label="開始玩 Hatchu">
        <span class="logo-wrap">
          <img class="game-logo" src="games/hatchu/assets/logo.png" alt="Hatchu">
        </span>
        <span class="play-label">開始玩 <span aria-hidden="true">▶</span></span>
      </a>
    </nav>

  </main>
</body>
</html>

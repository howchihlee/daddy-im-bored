<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>極光小火車・注音衝刺</title>
<link rel="icon" href="data:,">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff6dc; --cream-deep:#e9d6a4; --ink:#2b2a33; --ink-soft:#5f5a4e; --orange:#ff6319; --green:#2f8f5b; --red:#c2403a; --sky:#0d1626;
  color-scheme:dark; box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border:0}
button:focus-visible{outline:4px solid var(--orange);outline-offset:3px}
#stage{position:fixed;inset:0;background:var(--sky)}
#cv{display:block;width:100%;height:100%}
.zy{font-family:"Bopomofo","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

/* 遊戲中的 HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
#hud.on{display:block}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(8px,2.5vw,22px);align-items:start}
.opt{pointer-events:auto;height:clamp(64px,19vh,120px);border-radius:22px;background:var(--cream);color:var(--ink);font-size:clamp(40px,12vh,84px);font-weight:900;line-height:1;box-shadow:0 7px 0 var(--cream-deep),0 12px 24px rgba(0,0,0,.35);transition:transform .08s}
@media (orientation:portrait){
  .opt{height:clamp(84px,15vh,150px);font-size:clamp(56px,11vh,110px);border-radius:26px}
  #replay{width:clamp(60px,16vw,84px);height:clamp(60px,16vw,84px)}
  #clock{font-size:clamp(26px,7vw,40px)}
  #prog{width:min(60vw,460px);left:auto;right:max(28px,calc(env(safe-area-inset-right) + 16px));transform:none;bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px))}
  .gauge{bottom:max(16px,calc(env(safe-area-inset-bottom) + 8px))}
}
.opt:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cream-deep),0 6px 14px rgba(0,0,0,.35)}
.opt.ok{background:#d6f3df;color:var(--green)}
.opt.no{background:#fbd9d5;color:var(--red);animation:shake .3s}
.opt:disabled{cursor:default}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#replay{pointer-events:auto;width:clamp(56px,13vh,84px);height:clamp(56px,13vh,84px);border-radius:50%;background:var(--orange);color:#fff;box-shadow:0 6px 0 #b8420f,0 10px 20px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .08s}
#replay:active{transform:translateY(4px);box-shadow:0 2px 0 #b8420f}
#replay svg{width:58%;height:58%}
#replay.talk{animation:pulse .5s}
.mid small{color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#clock{font-variant-numeric:tabular-nums;color:#fff;font-weight:900;font-size:clamp(22px,5.5vh,40px);line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#clock.hot{color:#ffb38a}
#clock.zero{color:#ff8a7a}
.gauge{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);font-weight:700;line-height:1.05}
.gauge b{font-size:clamp(26px,6vh,44px);font-weight:900;font-variant-numeric:tabular-nums}
.gauge span{font-size:12px;opacity:.85}
#prog{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,calc(env(safe-area-inset-bottom) + 6px));width:min(46vw,460px);height:10px;border-radius:10px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
#prog i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;background:var(--orange)}
#prog b{position:absolute;right:-16px;top:50%;width:30px;height:30px;transform:translateY(-50%);border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;box-shadow:0 0 0 3px #fff}
#prog u{position:absolute;top:50%;left:0;transform:translate(-50%,-55%);font-size:22px;line-height:1;text-decoration:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(40px,12vh,96px);font-weight:900;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.6);opacity:0;pointer-events:none}
#msg.show{animation:pop .9s}

/* 面板 */
.panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,16,34,.55);backdrop-filter:blur(3px);padding:16px;z-index:5}
.panel.on{display:flex}
.card{background:var(--cream);color:var(--ink);border-radius:28px;padding:22px 26px 20px;width:min(92vw,560px);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:center}
.card h1{margin:0;font-size:clamp(24px,6vh,38px);font-weight:900;letter-spacing:.06em}
.card .sub{margin:4px 0 14px;color:var(--ink-soft);font-size:14px}
.card .sub em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:17px;color:var(--orange)}
.card p{margin:0 0 12px;font-size:14px;line-height:1.7;color:var(--ink-soft)}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}
.pill{background:#fff;color:var(--ink);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--cream-deep)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--cream);box-shadow:0 3px 0 #000}
#vehicles{margin-top:-6px}
#vehicles .pill{font-size:15px;padding:10px 16px}
.go{display:block;width:100%;background:var(--orange);color:#fff;border-radius:18px;padding:16px;font-size:clamp(20px,4.5vh,26px);font-weight:900;box-shadow:0 6px 0 #b8420f}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #b8420f}
.quiet{background:transparent;color:var(--ink-soft);padding:12px 8px 0;font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}
.gal{position:relative;margin:0 0 14px;background:#2d3040;border-radius:20px;overflow:hidden;box-shadow:inset 0 -6px 0 #23252f}
.gal canvas{display:block;width:100%;height:clamp(120px,22vh,190px)}
.gal-nav{position:absolute;top:0;bottom:30px;width:52px;background:transparent;color:#fff;font-size:40px;font-weight:900;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.6);display:grid;place-items:center}
.gal-nav:disabled{opacity:0;pointer-events:none}
#galPrev{left:0} #galNext{right:0}
.gal-cap{position:absolute;left:0;right:0;bottom:8px;color:#fff;font-size:14px;font-weight:700;letter-spacing:.04em}
.gal-cap span{opacity:.75;font-weight:500;margin-left:6px}
.gal-cap i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.gal-empty{padding:28px 10px;color:#cfd2dc;font-size:14px}
.stats div{background:#fff;border-radius:16px;padding:10px 6px;box-shadow:0 3px 0 var(--cream-deep)}
.stats b{display:block;font-size:clamp(22px,5vh,32px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:12px;color:var(--ink-soft)}
#verdict{font-size:clamp(28px,7vh,44px);font-weight:900;margin:0}
#verdict.late{color:var(--red)}
#verdict.win{color:var(--green)}

#debug{position:fixed;right:8px;top:8px;z-index:6;display:none;background:rgba(255,246,220,.92);color:var(--ink);border-radius:12px;padding:8px 10px;font-size:12px;width:220px}
#debug.on{display:block}
#debug label{display:grid;grid-template-columns:62px 1fr 38px;align-items:center;gap:6px;margin:3px 0}
#debug input{width:100%}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){ .opt,.go,#replay{transition:none} .opt.no{animation:none} }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div id="hud">
  <div class="row">
    <button class="opt zy" id="optL" type="button" aria-label="左邊選項"></button>
    <div class="mid">
      <button id="replay" type="button" aria-label="再聽一次題目"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l4 4V6L7 10z" fill="currentColor" stroke="none"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.5 6.5a8 8 0 0 1 0 11"/></svg></button>
      <small>再聽一次</small>
      <div id="clock">0</div>
    </div>
    <button class="opt zy" id="optR" type="button" aria-label="右邊選項"></button>
  </div>
  <div class="gauge"><b id="spd">30</b> <span>km/h</span></div>
  <div id="prog"><i id="progFill"></i><u id="progTrain">🚂</u><b>F</b></div>
  <div id="msg"></div>
</div>

<div class="panel on" id="title">
  <div class="card">
    <h1>注音衝刺</h1>
    <div class="sub">極光小火車 <em>F Train · Aurora St</em></div>
    <p>聽注音，點上面對的那一邊。答對<span class="vn">火車</span>就加速，不答會慢慢變慢。<br><span id="goal">開到 F 月台！</span>開快一點，前面的車會被壓扁；開太慢，後面就塞車了。</p>
    <div class="pills" id="vehicles" aria-label="選車子">
      <button class="pill" type="button" data-v="train" aria-pressed="true">🚂 小火車</button>
      <button class="pill" type="button" data-v="truck" aria-pressed="false">🐧 企鵝怪獸卡車</button>
    </div>
    <div class="pills" id="groups">
      <button class="pill" type="button" data-g="basic" aria-pressed="true">入門 8 個</button>
      <button class="pill" type="button" data-g="initials" aria-pressed="false">聲符 21 個</button>
      <button class="pill" type="button" data-g="finals" aria-pressed="false">韻符 13 個</button>
      <button class="pill" type="button" data-g="medials" aria-pressed="false">介符 3 個</button>
      <button class="pill" type="button" data-g="all" aria-pressed="false">全部 37 個</button>
    </div>
    <button class="go" id="start" type="button">出發 ▶</button>
    <button class="quiet" id="fs" type="button">全螢幕</button>
  </div>
</div>

<div class="panel" id="result">
  <div class="card">
    <p id="verdict">到站！</p>
    <p id="verdictSub"></p>
    <div class="stats">
      <div><b id="rTime">0.0</b><span>秒</span></div>
      <div><b id="rHit">0 / 0</b><span>答對</span></div>
      <div><b id="rSquash">0</b><span>壓扁</span></div>
    </div>
    <div class="gal" id="gal">
      <canvas id="galCv" aria-label="被壓扁的車"></canvas>
      <button class="gal-nav" id="galPrev" type="button" aria-label="上一輛">‹</button>
      <button class="gal-nav" id="galNext" type="button" aria-label="下一輛">›</button>
      <div class="gal-cap" id="galCap"></div>
    </div>
    <button class="go" id="again" type="button">再玩一次</button>
    <button class="quiet" id="back" type="button">換範圍</button>
  </div>
</div>


<div id="debug"></div>

<!-- aurora-train.js -->
<script>
/*!
 * aurora-train.js — 極光小火車・紙盒火車模組
 * 版本 v1.2.0（第十二段：車頂發光孢子）
 *
 * ── 變更紀錄 ───────────────────────────────────────────────
 *  v1.2.0  車頂發光孢子（第十二段）
 *    · 新增：env.roof 可設 { kind: 'spores', amount }，車頂沾上會微微明滅的發光孢子，青藍色為主、夾雜少量淡紫；
 *      amount 越大孢子越多，一顆一顆加上去，不會整片跳出來。客車落在弧形車頂、煤水車落在煤堆、機關車落在駕駛室頂。
 *    · 新增：env.roof 也可以是陣列，同時疊好幾種，例如 [{ kind: 'leaves', amount: .5 }, { kind: 'spores', amount: .8 }]，
 *      落葉漸少、孢子漸多的過場不必硬切。原本的單一物件寫法照舊可用。
 *    · 孢子用車廂本地座標放在車頂表面上，跟著姿態投影：平地正側面時沿車頂輪廓排成一列，俯看時散在整片車頂；
 *      跟車廂一起畫，被場景遮住時一起被遮；機關車的孢子畫在煙囪之前，正對鏡頭時由煙囪擋住。
 *    · 對各段的影響：沒有設定 spores 時外觀與 v1.1.1 完全相同，舊段落同步後不變，基準比對應全數通過；
 *      依規範匯出一份 v1.2.0 的基準。
 *  v1.1.1  客車車頂與車身對齊
 *    · 修：車頂弧線兩端原本落在 y = −58，比車身頂緣 −60 低，車身頂角會從車頂兩端冒出來，
 *      斜看出現台階、露出車身頂面。車頂改成兩端對齊車身頂緣（−60）、中間最高 −65.5，
 *      沿車長、車寬各多出一點成為屋簷，完整蓋住車身。
 *    · 側面圖的車頂弧、濕亮的反光線、車頂落葉都改貼同一條弧線，任何角度看都是同一個形狀。
 *  v1.1.0  客車與煤水車改成實心
 *    · 客車：底架、車身各為實心箱子；車頂沿側面那道弧擠出成有弧度的實心頂蓋，
 *      取代原本平的頂面板與端面上另畫的拱，側面、端面、頂面三者對得起來。
 *    · 煤水車：底架、車身加隆起的實心煤堆，車身頂緣留一圈紅邊；端面不再另畫煤堆剪影。
 *    · 積雪與落葉改貼著新的弧形車頂和煤堆表面。
 *    · 柱體只畫朝向鏡頭的面（凸形體背對的面本來就被擋住），效能較好。
 *    · 平地正側面照舊只畫側面圖，外觀不變。
 *  v1.0.3  駕駛室改成實心箱子
 *    · 駕駛室與車頂不再由一片片截面疊成，改用和煙囪相同的實心柱體，正面不再有細直條紋；
 *      受光面只略微提亮，保持紅色車身與深色頂蓋。前牆在鍋爐上方加兩扇小圓窗。
 *    · 車頭朝鏡頭時駕駛室最先畫（在最後方），背對時在鍋爐、汽包之後才畫（擋在最前方）。
 *    · 平地正側面（沒有俯角、沒有轉向）照舊只畫側面圖，外觀不變。
 *  v1.0.2  煙囪改成 T 字箱型
 *    · 煙囪由「中央圓柱截面＋只畫在朝向鏡頭那一側的側面圖」改成三段實心柱體：
 *      窄煙囪頸、往上張開的喇叭口、最寬的黃銅帽緣（俯看時頂面是黑色煙囪口加一圈黃銅邊）。
 *      兩個側面、前後面、頂面依視角自動出現，
 *      不再只出現一面、也不會變成薄紙。
 *    · 車頭朝鏡頭時煙囪最後畫（擋在駕駛室前面），背對時最先畫（被駕駛室擋住下半截）。
 *  v1.0.1  機關車正面修正
 *    · 修：車頭正對鏡頭時駕駛室、煙囪等實體截面消失。截面原本跟著側面一起收成零寬；
 *      現在每個零件照真實投影畫輪廓，接近正對時加一圈均勻描邊補滿片與片之間的縫，
 *      正對時接成實心輪廓，翻面時也不會跳動。
 *    · 修：煙囪、汽包、汽笛與頭燈箱原本畫在最外側的車身側面，斜看會多出一根薄紙般的煙囪；
 *      改畫在它們實際所在的車寬中央（約 ±6），和實體截面重合成一根。
 *    · 改：每片截面裡的零件依朝向排前後，正對時煙囪與頭燈箱擋在駕駛室前面。
 *  v1.0.0  第十段「雨後巨木森林・樹屋村」
 *    · 從各段 HTML 抽出為獨立模組；俯角 0 時與前九段的正側面畫法一致。
 *    · 三維姿態：依路徑的水平朝向、坡度與俯角，為每節車組出
 *      側面／端面／車頂三組基底向量，俯看看得到車頂，轉彎看得到車頭。
 *    · 紙盒車廂：客車與煤水車加端面與頂面。
 *    · 機關車實體：沿車寬切片疊出圓鍋爐、圓煙箱、圓柱煙囪、方駕駛室、
 *      楔形排障器；正面有煙箱門與頭燈，背面有駕駛室後窗。（修「車頭像一片紙」）
 *    · 遠側車輪與車軸；正對側邊時保留輪胎厚度。（修「只有兩個輪子」）
 *    · 轉邊翻面：側面完全收成零寬才換面；翻面時截面明暗左右一致。（修「轉邊時扭一下」）
 *    · 選項：車頂落葉／積雪、窗上雨痕、潮濕滴水、夜燈、齒軌齒輪（第九段）。
 *
 * ── 座標約定（以後只改這一份，請勿各段各改） ─────────────────
 *  世界：x 往右、y 往下、z 朝向觀眾；s 為沿路徑的「水平弧長」，車頭在 s 最大處。
 *  車廂本地：+x 為車頭方向；y 往上為負，車輪著地在 y = 0；
 *            lz 為車寬方向，火車朝 +x 行駛時 +lz 朝向觀眾。
 *  車寬：機關車 30、煤水車 28、客車 32（CAR_WIDTH）。
 *  俯角 tilt = sin(俯角)，約 0.26 ≈ 15°；tilt = 0 即前九段的正側面。
 *
 * ── 用法 ──────────────────────────────────────────────────
 *  <script src="aurora-train.js"><\/script>   // 或在組裝時把整份內嵌進 HTML
 *  const train = AuroraTrain.create();                       // 預設五節：機關車、煤水車、三節客車
 *  const view  = { tilt: 0.26, project: AuroraTrain.projector({ tilt: 0.26, persp: 0.00034, z0: -150, axisAt: s => 3250 }) };

<script>
(function () {
'use strict';
const T = window.AuroraTrain, TK = window.AuroraTruck, B = window.AuroraBuilding, AP = window.AuroraProps, AC = window.AuroraCar, SO = window.AuroraSoldier, ZA = window.ZhuyinAudio;
const SK = window.AuroraSky ? AuroraSky.create({ seed: 7 }) : null;
const $ = s => document.querySelector(s);
const missing = ['AuroraTrain', 'AuroraTruck', 'AuroraBuilding', 'AuroraProps', 'AuroraCar', 'AuroraSoldier', 'AuroraSky', 'ZhuyinAudio'].filter(n => !window[n]);

/* ══ 可調參數（加 ?debug 會出現滑桿） ══ */
/* timer：限時倒數，目前關閉（0）。要開回來：改成 1，或網址加 ?timer。關閉時時鐘改成往上數、不會時間到。 */
const P = { dist: 300, v0: 30, boost: 15, decay: 3.5, vmin: 10, vmax: 100, limit: 30, timer: /[?&]timer/.test(location.search) ? 1 : 0, tilt: .2, zoom: 1.2 };
function goalText() { const g = document.querySelector('#goal'); if (g) g.textContent = P.timer ? P.limit + ' 秒內開到 F 月台！' : '開到 F 月台！'; }
goalText();
const DEBUG = /[?&]debug/.test(location.search);
const MOBILE = /Mobi|Android|iPhone|iPad/.test(navigator.userAgent) || navigator.maxTouchPoints > 1;

/* ══ 世界尺寸（公尺 × unit），和 city-bench 相同 ══ */
const UNIT = 8, CH = 175 * UNIT, STREET = 20 * UNIT, TRACK_Z = -2.5 * UNIT, CAR_SCALE = 2;
const Z = { bldg: -29.9 * UNIT, prop: -24.5 * UNIT, sub: -27.1 * UNIT, curb: -23.6 * UNIT, road: -22.75 * UNIT, park: -18.25 * UNIT, lane2: -11.75 * UNIT, lane: 6.75 * UNIT, roadEnd: 13.25 * UNIT, fcurb: 14.1 * UNIT, fprop: 15.25 * UNIT, far: -112 * UNIT };
const M = m => m * UNIT;
const LAYERS = [
  { name: '遠景', par: .2, scale: .22, ground: .6, groundP: .72, scaleP: .3, haze: 1, zm: -7.5, jitter: 30, w: { brick: .4, limestone: 2, glass: 2.6 }, on: true },
  { name: '中景', par: .5, scale: .4, ground: .71, groundP: .77, haze: .45, zm: -7.5, jitter: 10, w: { brownstone: .8, brick: 2, limestone: 1.6, glass: 1 }, on: !MOBILE },
  { name: '街景', par: 1, scale: 1, ground: .86, groundP: .82, haze: 0, zm: -29.9, jitter: 2, w: { brownstone: 2.6, brick: 3, limestone: 1, glass: .4 }, on: true },
].map((L, i) => Object.assign(L, { idx: i, chunks: new Map() }));
const SEED = 3, HOUR = 18.4;
const PROJ = T.projector;
const cv = $('#cv'), ctx = cv.getContext('2d');

/* ══ 注音題庫（和地鼠王同一組） ══ */
const initials = [...'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'], finals = [...'ㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ'], medials = [...'ㄧㄨㄩ'];
const GROUPS = { basic: initials.slice(0, 8), initials, finals, medials, all: [...initials, ...medials, ...finals] };
const CONFUSE = ['ㄓㄗ', 'ㄔㄘ', 'ㄕㄙ', 'ㄣㄥ', 'ㄢㄤ', 'ㄛㄡ', 'ㄜㄦ', 'ㄧㄩ', 'ㄈㄏ', 'ㄋㄌ', 'ㄅㄆ', 'ㄉㄊ', 'ㄍㄎ', 'ㄐㄑ', 'ㄑㄒ', 'ㄟㄝ', 'ㄠㄡ'];
let group = 'basic';

/* ══ 聲音 ══ */
const FMT = (() => { const a = document.createElement('audio'); if (!a.canPlayType) return null; if (a.canPlayType('audio/mp4; codecs="mp4a.40.2"')) return 'm4a'; if (a.canPlayType('audio/ogg; codecs="opus"')) return 'ogg'; return null; })();
const clips = new Map();
function clip(k) { let a = clips.get(k); if (!a) { a = new Audio('data:' + (FMT === 'm4a' ? 'audio/mp4' : 'audio/ogg;codecs=opus') + ';base64,' + ZA[k][FMT]); a.preload = 'auto'; clips.set(k, a); } return a; }
function speech(k) { if (!('speechSynthesis' in window)) return; const u = new SpeechSynthesisUtterance(k); u.lang = 'zh-TW'; u.rate = .7; speechSynthesis.cancel(); speechSynthesis.speak(u); }
let speaking = null;
function sayZhuyin(k) { if (speaking) { try { speaking.pause(); } catch (e) {} } if (!FMT || !ZA[k]) { speech(k); return; } const a = clip(k); speaking = a; a.currentTime = 0; a.play().catch(() => speech(k)); $('#replay').classList.remove('talk'); void $('#replay').offsetWidth; $('#replay').classList.add('talk'); }
let actx = null;
const ac = () => { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; };
function env(g, t0, a, peak, hold, rel) { g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a); g.gain.setValueAtTime(peak, t0 + a + hold); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + hold + rel); }
function osc(type, f0, f1, t0, dur, peak, a, rel, dest) { const c = ac(), o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur); env(g, t0, a, peak, Math.max(0, dur - a - rel), rel); o.connect(g); g.connect(dest || c.destination); o.start(t0); o.stop(t0 + dur + .02); }
function tone(ok) { try { const c = ac(), t0 = c.currentTime; if (ok) { osc('sine', 660, 660, t0, .12, .14, .01, .08); osc('sine', 880, 880, t0 + .1, .16, .14, .01, .1); osc('triangle', 1320, 1320, t0 + .2, .12, .06, .01, .08); } else { osc('square', 230, 180, t0, .22, .06, .01, .12); } } catch (e) {} }
function truckHorn(long) { try { const c = ac(), t0 = c.currentTime, d = long ? .9 : .45, lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; lp.connect(c.destination); osc('sawtooth', 233, 228, t0, d, .09, .02, .12, lp); osc('sawtooth', 294, 288, t0, d, .07, .02, .12, lp); if (long) { osc('sawtooth', 233, 228, t0 + d + .12, .5, .08, .02, .15, lp); osc('sawtooth', 294, 288, t0 + d + .12, .5, .06, .02, .15, lp); } } catch (e) {} }
function rev() { try { const c = ac(), t0 = c.currentTime, lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, t0); lp.frequency.exponentialRampToValueAtTime(1600, t0 + .25); lp.connect(c.destination); osc('sawtooth', 70, 190, t0, .45, .12, .02, .2, lp); osc('square', 35, 95, t0, .45, .06, .02, .2, lp); } catch (e) {} }
function whistle(long) { if (vehicle === 'truck') return truckHorn(long); try { const c = ac(), t0 = c.currentTime, d = long ? 1.1 : .5, lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200; lp.connect(c.destination); osc('sawtooth', 540, 520, t0, d, .08, .06, .25, lp); osc('sawtooth', 720, 700, t0, d, .06, .06, .25, lp); osc('sine', 1080, 1040, t0, d, .05, .06, .25, lp); } catch (e) {} }
function honk() { try { const c = ac(), t0 = c.currentTime; osc('square', 310, 300, t0, .28, .05, .01, .08); osc('square', 392, 380, t0, .28, .04, .01, .08); } catch (e) {} }
function splat() { try { const c = ac(), t0 = c.currentTime, n = c.createBufferSource(), buf = c.createBuffer(1, c.sampleRate * .18 | 0, c.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); n.buffer = buf; const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(1800, t0); f.frequency.exponentialRampToValueAtTime(200, t0 + .18); const g = c.createGain(); g.gain.value = .35; n.connect(f); f.connect(g); g.connect(c.destination); n.start(t0); osc('sine', 320, 55, t0, .3, .25, .01, .15); } catch (e) {} }
function tick(hi) { try { const c = ac(), t0 = c.currentTime; osc('sine', hi ? 1320 : 880, hi ? 1320 : 880, t0, hi ? .35 : .12, .12, .01, hi ? .25 : .08); } catch (e) {} }
function puff() { if (vehicle === 'truck') return rev(); try { const c = ac(), t0 = c.currentTime, n = c.createBufferSource(), buf = c.createBuffer(1, c.sampleRate * .25 | 0, c.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / d.length * 5); n.buffer = buf; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = .7; const g = c.createGain(); g.gain.value = .25; n.connect(f); f.connect(g); g.connect(c.destination); n.start(t0); } catch (e) {} }
function unlockAudio() { try { ac(); const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='); a.play().catch(() => {}); } catch (e) {} if (FMT) for (const k of GROUPS[group]) { const a = clip(k); if (a.unlocked) continue; a.muted = true; a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; a.unlocked = true; }).catch(() => { a.muted = false; }); } }

/* ══ 街段、小物、建築（沿用設計台） ══ */
function chunk(L, i) {
  let list = L.chunks.get(i); if (list) return list;
  list = B.row({ x0: i * CH, x1: (i + 1) * CH - (L.idx > 0 ? STREET : 0), z: L.zm * UNIT, seed: (SEED * 1000003 + L.idx * 7919 + i * 104729) | 0, styles: L.w, unit: UNIT, jitter: L.jitter });
  L.chunks.set(i, list); return list;
}
const PROPS = new Map();
function propsOf(i) {
  let p = PROPS.get(i); if (p) return p;
  const gaps = [[i * CH - STREET, i * CH, i - 1], [(i + 1) * CH - STREET, (i + 1) * CH, i]], seed = (SEED * 92821 + i * 68917) | 0;
  p = AP.street({ x0: i * CH, x1: (i + 1) * CH, z: Z.prop, zSub: Z.sub, seed, unit: UNIT, gaps, subway: 0, treeEvery: MOBILE ? 15 : 9 });
  PROPS.set(i, p); return p;

function updateTraffic(dt) {

  lastTarget = target = k; asked++;
  let other; const pair = CONFUSE.find(p => p.includes(k));
  if (pair && Math.random() < .5 && pool.includes(pair.replace(k, ''))) other = pair.replace(k, '');
  else do { other = pool[(Math.random() * pool.length) | 0]; } while (other === k);
  const left = Math.random() < .5;
  optL.textContent = left ? k : other; optR.textContent = left ? other : k;
  for (const b of [optL, optR]) { b.className = 'opt zy'; b.disabled = false; }

/* ══ 結果視窗：這回合壓扁的車（同種同色只留一台），反覆壓扁、復原 ══ */
const COLOR_NAME = { '176,30,40': '紅', '30,52,110': '藍', '190,194,198': '銀', '34,36,40': '黑', '236,236,232': '白', '40,98,72': '綠', '112,58,112': '紫', '214,120,40': '橘' };

}

/* 限時：顯示剩餘秒數（最後 5 秒變色）；不限時：顯示已經開了幾秒 */
function showClock() { if (P.timer) setClock(P.limit - elapsed); else { const el = $('#clock'); el.textContent = Math.floor(elapsed); el.className = ''; } }
function setClock(v) { const el = $('#clock'); el.textContent = Math.ceil(Math.max(0, v)); el.className = v <= 0 ? 'zero' : v <= 5 ? 'hot' : ''; }

function update(dt) {
  t += dt;
  if (state === 'count') {
    const was = countT | 0; countT += dt; const now = countT | 0;
    if (now !== was) { if (now < 3) { flash(String(3 - now)); tick(false); } }
    if (countT >= 3) { state = 'run'; vk = P.v0; flash('出發！'); tick(true); whistle(false); nextQuestion(); }
  }
  if (state === 'run') {
    elapsed += dt; showClock();
    vk = Math.max(P.vmin, vk - P.decay * dt);
    const remainM = (PS - frontS) / UNIT, brakeM = (vk / 3.6) * (vk / 3.6) / (2 * 3);
    if (remainM <= brakeM + 2 || remainM <= 6) { state = 'arrive'; whistle(true); for (const b of [optL, optR]) b.disabled = true; }
    else if (P.timer && elapsed >= P.limit) { state = 'late'; lateT = 0; setClock(0); for (const b of [optL, optR]) b.disabled = true; flash('時間到'); }
  }

  }

  if (state === 'done') { doneT += dt; salute = Math.min(1, salute + dt * 1.6); if (frontS === PS && doneT >= 1.4 && !$('#result').classList.contains('on')) finish(true); }
  if (vehicle === 'truck') {                                    // 彈跳：重力往下拉，落地時記下衝擊給懸吊晃
    if (hop > 0 || hopV > 0) { hopV -= 900 * dt; hop += hopV * dt; if (hop <= 0) { land = Math.min(1, land + Math.max(0, -hopV) / 260); hop = 0; hopV = 0; } }
    land = Math.max(0, land - dt * 2.2);
  }
  const vT = vk / 3.6 * UNIT;
  frontS += vT * dt;
  $('#spd').textContent = Math.round(vk);

  ctx.textAlign = 'left'; ctx.font = `900 ${h * .5}px "Noto Sans TC", sans-serif`; ctx.fillText('極光街站', -w / 2 + h * 1.15, h * .48);

  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 ${br * 1.4}px "Helvetica Neue", Arial, sans-serif`; ctx.fillText('F', bp[0], bp[1] + br * .08);
  // 夜裡屋頂下的燈
  if (n > .3) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; for (let x = x0 + M(6); x < x1; x += M(12)) { const p = pt(x, -CY + M(.6), zp), r = M(5) * p[2]; const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], r); g.addColorStop(0, `rgba(255,228,170,${.28 * n})`); g.addColorStop(1, 'rgba(255,228,170,0)'); ctx.fillStyle = g; ctx.fillRect(p[0] - r, p[1] - r, r * 2, r * 2); } ctx.restore(); }
}

/* ══ 畫面 ══ */
let fps = 60, CAM_K = 40;
const skyCv = document.createElement('canvas'); let skyTick = 0, skySt = null;
const smokeSpr = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(235,238,245,1)'); g.addColorStop(.5, 'rgba(235,238,245,.45)'); g.addColorStop(1, 'rgba(235,238,245,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return c; })();
function frame(dt) {
  const dpr = MOBILE ? Math.min(1.25, window.devicePixelRatio || 1) : Math.min(1.5, window.devicePixelRatio || 1), r = cv.getBoundingClientRect(), W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
  if (!W || !H) return;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const portrait = W < H;
  // 直版：以寬度定縮放（畫面寬 ≈ 900 世界單位，火車佔一半多），鏡頭偏後讓車頭前面留一點路；橫版照舊以高度定
  const k0 = (portrait ? W / 432 : H / 760 * Math.min(1, W / H / 1.5)) * P.zoom; viewHalf = W / 2 / k0 * 1.15;
  CAM_K = portrait ? 20 : 40;                                   // 鏡頭中心在車頭後方幾個世界單位：車頭略偏右，前方留路
  const horizon = portrait ? .5 : .6;
  // 天空：半解析度離屏、每兩格更新一次（極光那幾百次 drawImage 是手機最大的負擔）
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sw = Math.ceil(W / 2), sh = Math.ceil(H / 2);
  if (skyCv.width !== sw || skyCv.height !== sh) { skyCv.width = sw; skyCv.height = sh; skySt = null; }
  if (!skySt || (skyTick++ & 1) === 0) { const sc = skyCv.getContext('2d'); sc.setTransform(1, 0, 0, 1, 0, 0); skySt = SK.draw(sc, { x: 0, y: 0, w: sw, h: sh, horizon: sh * horizon }, { hour: HOUR, time: t, pan: camX * k0 / 2, clouds: .35, wind: .3, aurora: MOBILE ? .6 : .85, moonPhase: .55, cityGlow: .5 }); }
  ctx.drawImage(skyCv, 0, 0, W, H);
  const st = skySt, n = st.night, sky = { top: st.top, hor: st.horizon };
  const lc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), rgb = c => `rgb(${c.map(v => v | 0).join(',')})`;
  for (const L of LAYERS) {
    if (!L.on) continue;
    const k = k0 * (portrait && L.scaleP ? L.scaleP : L.scale), gy = H * (portrait ? L.groundP : L.ground), ax = camX * L.par, half = W / 2 / k * 1.25 + 200;
    ctx.setTransform(k, 0, 0, k, W / 2 - ax * k, gy);
    const project = PROJ({ tilt: P.tilt, persp: .00026, z0: 0, axisAt: () => ax }), view = { tilt: P.tilt, project };
    const hz = L.haze * .6, hc = sky.hor;
    const xa = ax - half * 2, xb = ax + half * 2, Pt = (x, z) => project(x, 0, z, x);
    const quad = (z0, z1, col) => { const a = Pt(xa, z0), b = Pt(xb, z0), c = Pt(xb, z1), d = Pt(xa, z1); ctx.fillStyle = rgb(lc(col, hc, hz)); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fill(); };
    const bottom = (H - gy) / k + 10;
    if (L.idx < 2) {
      const pv = lc([150, 146, 140], [30, 32, 44], n), a = Pt(xa, (L.zm - 37.5) * UNIT);
      ctx.fillStyle = rgb(lc(pv, hc, hz)); ctx.fillRect(xa, a[1], xb - xa, bottom - a[1]);
    } else {
      quad(Z.far, Z.curb, lc([170, 164, 156], [40, 42, 54], n));
      quad(Z.curb, Z.road, lc([206, 202, 194], [62, 64, 76], n));
      quad(Z.road, Z.roadEnd, lc([74, 76, 82], [24, 26, 34], n));
      quad(Z.roadEnd, Z.fcurb, lc([206, 202, 194], [62, 64, 76], n));
      const f = Pt(xa, Z.fcurb); ctx.fillStyle = rgb(lc([170, 164, 156], [40, 42, 54], n)); ctx.fillRect(xa, f[1], xb - xa, bottom - f[1]);
      const asph = rgb(lc([74, 76, 82], [24, 26, 34], n)), curbC = rgb(lc([206, 202, 194], [62, 64, 76], n)), zebra = rgb(lc([236, 234, 226], [92, 94, 104], n));
      const box = (x0, x1, z0, z1, col) => { const a = project(x0, 0, z0, x0), b = project(x1, 0, z0, x1), c = project(x1, 0, z1, x1), d = project(x0, 0, z1, x0); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fill(); };
      for (let g = Math.floor(xa / CH) * CH; g < xb + CH; g += CH) {
        const g0 = g - STREET, g1 = g, r0 = g0 + 3 * UNIT, r1 = g1 - 3 * UNIT;
        box(r0, r1, Z.far, Z.road, asph); box(r0, r1, Z.roadEnd, -Z.far, asph);
        box(r0 - .4 * UNIT, r0, Z.far, Z.road, curbC); box(r1, r1 + .4 * UNIT, Z.far, Z.road, curbC); box(r0 - .4 * UNIT, r0, Z.roadEnd, -Z.far, curbC); box(r1, r1 + .4 * UNIT, Z.roadEnd, -Z.far, curbC);
        for (const [c0, c1] of [[g0 + .4 * UNIT, g0 + 3.4 * UNIT], [g1 - 3.4 * UNIT, g1 - .4 * UNIT]])
          for (let z = Z.road + .3 * UNIT; z < Z.roadEnd - .2 * UNIT; z += 1.2 * UNIT) box(c0, c1, z, z + .6 * UNIT, zebra);
      }
      ctx.fillStyle = rgb(lc([96, 80, 64], [30, 26, 26], n));
      for (let x = Math.floor(xa / 14) * 14; x < xb; x += 14) { const a = project(x, 0, TRACK_Z - 19, x), b = project(x + 6, 0, TRACK_Z - 19, x), c = project(x + 6, 0, TRACK_Z + 19, x), d = project(x, 0, TRACK_Z + 19, x); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.fill(); }
      for (const dz of [-11, 11]) { const a = Pt(xa, TRACK_Z + dz), b = Pt(xb, TRACK_Z + dz); ctx.strokeStyle = rgb(lc([150, 150, 158], [70, 72, 86], n)); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
      ctx.fillStyle = rgb(lc([228, 214, 150], [110, 104, 80], n));
      const ds = 7.5 * UNIT; for (const zl of [Z.lane, Z.lane2]) for (let x = Math.floor(xa / ds) * ds; x < xb; x += ds) { const a = project(x, 0, zl, x), b = project(x + ds / 2, 0, zl, x), c = project(x + ds / 2, 0, zl + .35 * UNIT, x), d = project(x, 0, zl + .35 * UNIT, x); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.fill(); }
      // 月台前的停車線
      const sl = project(PS + M(1), 0, TRACK_Z - M(3.5), PS), sl2 = project(PS + M(1), 0, TRACK_Z + M(3.5), PS); ctx.strokeStyle = rgb(lc([236, 234, 226], [92, 94, 104], n)); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sl[0], sl[1]); ctx.lineTo(sl2[0], sl2[1]); ctx.stroke();
    }
    // 建築
    const i0 = Math.floor((ax - half) / CH), i1 = Math.floor((ax + half) / CH);
    let list = [];
    for (let i = i0; i <= i1; i++) list = list.concat(chunk(L, i));
    for (const [i, l] of L.chunks) if (i < i0 - 2 || i > i1 + 2) { l.forEach(b => b.dispose()); L.chunks.delete(i); }
    const vis = list.filter(b => b.x1 > ax - half && b.x0 < ax + half);
    const penv = { night: n, time: t, wind: .3, season: 'summer', haze: hz, hazeColor: hc }, cenv = { night: n, time: t };
    let props = [], mid = [], fore = [];
    if (L.idx === 2) {
      for (let i = i0; i <= i1; i++) props = props.concat(propsOf(i));
      for (const i of PROPS.keys()) if (i < i0 - 2 || i > i1 + 2) PROPS.delete(i);
      props = props.filter(p => !(p.kind === 'tree' && Math.abs(p.x - subway.x - M(3)) < M(8)));            // 地鐵入口附近不種樹
      props.push(subway);
      const inView = p => p.span[1] > ax - half && p.span[0] < ax + half;
      props = props.filter(inView);
      for (const p of props) p.light(ctx, view, penv);
      const m = half + 25 * UNIT, all = cars.filter(c => Math.max(c.front, c.rear) > ax - m && Math.min(c.front, c.rear) < ax + m);
      for (const c of all) (c.z < TRACK_Z ? mid : fore).push(c);
      for (const c of all) c.light(ctx, view, cenv);
    }
    for (const b of B.order(vis, ax)) b.draw(ctx, view, { night: n, haze: hz, hazeColor: hc });
    if (L.idx === 2) {
      const items = props.map(p => ({ z: p.z, x: p.cx, f: () => p.draw(ctx, view, penv) })).concat(mid.map(c => ({ z: c.z, x: c.x, f: () => c.draw(ctx, view, cenv) })));
      items.push({ z: PLAT.z1, x: PS, f: () => drawPlatform(project, n, hc, hz, ax, k) });
      soldiers.forEach((s, i) => { const x = PS + M(3 + i * 3.1); items.push({ z: PLAT.zMid, x, f: () => { s.layout({ x, y: -PH, z: PLAT.zMid }, Math.PI / 2, view); s.draw(ctx, { time: t, step: 0, march: 0, salute }); } }); });
      items.sort((a, b) => (a.z - b.z) || (Math.abs(b.x - ax) - Math.abs(a.x - ax)));
      for (const it of items) it.f();
      // 火車
      if (vehicle === 'truck') {
        // 飛起來時車頭先抬（hopV 越大越抬）；懸吊：空中車身離開車輪、落地後彈幾下、行駛中引擎微微抖
        const pitch = Math.max(-.1, Math.min(.1, hopV / 2200)), mid = frontS - 64;
        const rumble = vk > 1 ? (.5 + .5 * Math.sin(t * 38)) * Math.min(1, vk / 40) * 1.1 : .25 * (.5 + .5 * Math.sin(t * 9));
        const bounce = hop > 0 ? Math.min(9, 3 + hop * .35) : rumble + land * 7 * Math.abs(Math.sin(t * 17));

        truck.draw(ctx, { time: t, night: n, wheel: frontS, bounce, mud: Math.min(1, squashed * .12) });
      } else {
        train.layout(s => ({ x: s, y: 0, z: TRACK_Z }), frontS, view);
        train.draw(ctx, { time: t, night: n, wheel: frontS });
      }
      // 煙
      for (const p of smoke) { const q = project(p.x, p.y, p.z, p.x), rr = p.r * q[2]; ctx.globalAlpha = (1 - p.age / p.life) * .55; ctx.drawImage(smokeSpr, q[0] - rr, q[1] - rr, rr * 2, rr * 2); }

      for (const c of AC.order(fore, ax)) c.draw(ctx, view, cenv);
      for (const p of props) p.halo(ctx, view, penv);
      for (const c of mid.concat(fore)) c.halo(ctx, view, cenv);
    }
    if (L.idx < 2 && !MOBILE) { ctx.setTransform(1, 0, 0, 1, 0, 0); SK.mist(ctx, { x: 0, w: W, y: gy + L.zm * UNIT * P.tilt * k, h: H * (L.idx ? .08 : .12) }, { hour: HOUR, clouds: .35, cityGlow: .5, mist: .6 * (L.idx ? .45 : .7) }); }
  }
  fps = fps * .92 + (dt > 0 ? 1 / dt : 60) * .08;
  if (DEBUG) $('#dbgFps').textContent = fps.toFixed(0);
}

/* ══ 迴圈 ══ */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.5, (now - last) / 1000); last = now;
  let rr = dt; while (rr > 1e-4) { const s = Math.min(rr, 1 / 30); update(s); rr -= s; }
  frame(dt); drawGallery(dt); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ══ 介面 ══ */
$('#groups').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; group = b.dataset.g; for (const x of $('#groups').children) x.setAttribute('aria-pressed', x === b); });
$('#vehicles').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; vehicle = b.dataset.v; for (const x of $('#vehicles').children) x.setAttribute('aria-pressed', x === b); for (const el of document.querySelectorAll('.vn')) el.textContent = VEH[vehicle].name; $('#progTrain').textContent = VEH[vehicle].icon; });
$('#start').addEventListener('click', startGame);
$('#again').addEventListener('click', startGame);
$('#back').addEventListener('click', () => { $('#result').classList.remove('on'); $('#hud').classList.remove('on'); $('#title').classList.add('on'); state = 'title'; });
const fsBtn = $('#fs');
if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) fsBtn.style.display = 'none';
fsBtn.addEventListener('click', () => { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); });
document.addEventListener('visibilitychange', () => { if (document.hidden && speaking) { try { speaking.pause(); } catch (e) {} } });

/* ══ 除錯滑桿 ══ */
if (DEBUG) {
  window.__game = { P, gal, types: TRACK_TYPES, cars: () => cars, frontS: () => frontS, trainLen: () => veh().length, vehicle: v => { vehicle = v; }, hop: v => { hopV = v; }, target: () => target, state: () => state, pos: () => (frontS - START_S) / UNIT, jump: m => { frontS = START_S + M(m); }, speed: v => { vk = v; } };
  const d = $('#debug'); d.classList.add('on');
  d.innerHTML = '<div style="font-weight:900;margin-bottom:4px">校準 <span id="dbgFps"></span> fps</div>' + [['dist', '距離 m', 100, 400, 10], ['v0', '起速', 10, 60, 1], ['boost', '答對＋', 5, 40, 1], ['decay', '衰減/s', 0, 12, .5], ['vmax', '上限', 60, 160, 5], ['timer', '倒數', 0, 1, 1], ['limit', '秒數', 10, 60, 1], ['tilt', '俯角', 0, .35, .01], ['zoom', '縮放', .5, 1.4, .02]].map(([k, l, a, b, s]) => `<label>${l}<input type="range" data-k="${k}" min="${a}" max="${b}" step="${s}" value="${P[k]}"><span>${P[k]}</span></label>`).join('');
  d.addEventListener('input', e => { const i = e.target; if (!i.dataset.k) return; P[i.dataset.k] = +i.value; i.nextElementSibling.textContent = i.value; });
}
})();

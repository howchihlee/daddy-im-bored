<!-- Upper left limb -->
<path d="M44 48C39 47 36 49 32 48C29 47 28 44 26 42M32 48L23 51M31 49L27 55"/>
<!-- Lower left limb -->
<path d="M44 72C39 74 35 75 31 73L25 69M33 74L23 78M32 75L28 83"/>
</g>
</svg>

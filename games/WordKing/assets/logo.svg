<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="logo-title logo-desc">
<title id="logo-title">甲骨龜字標誌</title>
<desc id="logo-desc">依照龜形字範例設計，上方龜首、右側分格甲殼與左側肢爪，以古玉綠和米金色呈現。</desc>
<defs>
<linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#356858"/><stop offset="1" stop-color="#183f36"/></linearGradient>
<linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="30" y1="10" x2="65" y2="86"><stop stop-color="#fff0c2"/><stop offset="1" stop-color="#d9b977"/></linearGradient>
</defs>
<rect x="2" y="2" width="92" height="92" rx="25" fill="url(#badge)" stroke="#dfcb96" stroke-width="2"/>
<!-- Turtle-shaped glyph, drawn as editable vector strokes. -->
<g fill="none" stroke="url(#ink)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">

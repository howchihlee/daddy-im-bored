<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121826" />
  <title>認字王｜注音版（暗色＋音效）</title>
  <style>
    :root{
      --bg1:#0f172a;
      --bg2:#1e293b;
      --card:#111827;
      --card2:#1f2937;
      --text:#f8fafc;
      --muted:#cbd5e1;
      --good:#22c55e;
      --bad:#ef4444;
      --soft:#334155;
      --blue:#60a5fa;
      --shadow:0 14px 34px rgba(0,0,0,.35);
      --border:#475569;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      padding:18px;
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .app{
      width:min(760px,100%);
      background:rgba(17,24,39,.95);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:28px;
      text-align:center;
      border:2px solid #334155;
    }
    h1{margin:0 0 22px;font-size:clamp(30px,6vw,50px);color:#fff}
    .scorebar{display:flex;justify-content:safe center;align-items:center;gap:10px;margin-top:16px;overflow-x:auto;padding-bottom:6px}
    .scorebar>*{flex-shrink:0}
    .difficulty{display:flex;gap:4px}
    .grade-level{display:flex;gap:4px;padding-right:8px;border-right:1px solid #64748b}
    .difficulty-btn{background:#334155;color:#f8fafc;border:1px solid #64748b;border-radius:10px;padding:9px 7px;font-size:14px;cursor:pointer;white-space:nowrap}
    .difficulty-btn[aria-pressed="true"]{background:#60a5fa;color:#0f172a;border-color:#93c5fd;font-weight:800}
    .pill{
      background:var(--soft); color:#fff; border-radius:999px;
      padding:10px 16px; font-weight:800; font-size:17px; border:1px solid #475569;
    }
    .bopomofo-card{
      background:#1e293b; border:3px solid #fbbf24; border-radius:26px;
      padding:20px; margin:0 auto 24px; max-width:360px; box-shadow:0 7px 0 #92400e;
    }
    .label{color:#fde68a;font-size:16px;font-weight:800;margin-bottom:6px}
    #bopomofo{
      font-size:clamp(32px,10vw,60px); line-height:1.2; font-weight:900;
      letter-spacing:2px; white-space:normal; color:#fff;
    }
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .choice{
      min-height:190px; border:3px solid var(--border); border-radius:24px;
      background:var(--card2); color:#fff; font-size:clamp(54px,12vw,96px);
      font-weight:900; cursor:pointer; transition:.15s; display:flex;
      align-items:center; justify-content:center; user-select:none; -webkit-tap-highlight-color:transparent;
    }
    .choice:hover{transform:translateY(-3px);border-color:#93c5fd;background:#243244}
    .choice.correct{background:#052e16;border-color:var(--good)}
    .choice.wrong{background:#450a0a;border-color:var(--bad)}
    .controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
    .control-btn{
      border:none; color:#0f172a; font-size:18px; font-weight:900;
      border-radius:16px; padding:12px 18px; cursor:pointer;
    }
    #nextBtn{background:var(--blue);box-shadow:0 5px 0 #2563eb;font-size:28px;padding:18px 36px;width:min(360px,100%);min-height:72px}
    #soundBtn{background:#6b7280;box-shadow:0 5px 0 #374151}
    .control-btn:active{transform:translateY(3px);box-shadow:none!important}
    #message{
      min-height:48px; margin:21px 0 4px; font-size:25px;
      font-weight:900; line-height:1.5; color:#fff;
    }
    .hint{color:var(--muted);font-size:14px;margin-top:7px}
    @media (max-width:560px){
      body{padding:10px}
      .app{padding:20px 14px;border-radius:22px}
      .choices{gap:12px}
      .choice{min-height:150px}
      .bopomofo-card{max-width:300px;padding:16px}
    }

const wrongAudio = new Audio();
wrongAudio.preload = "auto";
wrongAudio.volume = 0.8;
let lastWrongSoundIndex = -1;

function stopWrongSound() {
  wrongAudio.pause();
  wrongAudio.currentTime = 0;
}

function playWrongSound() {
  stopCorrectSound();
  if (!soundOn) return;
  stopWrongSound();
  // 每次隨機選擇，避免連續播放同一個音效。
  const candidates = wrongSoundTracks.map((_, i) => i)
    .filter(i => i !== lastWrongSoundIndex);
  const index = candidates[Math.floor(Math.random() * candidates.length)];
  lastWrongSoundIndex = index;
  wrongAudio.src = wrongSoundTracks[index].src;
  const playback = wrongAudio.play();
  if (playback) playback.catch(() => {
    // 瀏覽器無法播放時，仍可繼續作答。
  });
}

function randomItem(exceptChar = null) {
  const candidates = activeItems.filter(item => item.char !== exceptChar);
  const pool = candidates.length ? candidates : activeItems;
  return pool[Math.floor(Math.random() * pool.length)];
}

function makeSingleChoice(item) {
  return {
    text: item.char,
    bopomofo: item.bopomofo
  };
}

function newQuestion() {
  locked = false;
  choiceA.className = "choice";
  choiceB.className = "choice";

  // 左右各顯示一個字；正確字與干擾字都從目前筆畫範圍的字庫隨機抽取。
  const correctItem = randomItem();
  const wrongItem = randomItem(correctItem.char);
  const correct = makeSingleChoice(correctItem);
  const wrong = makeSingleChoice(wrongItem);
  answer = correct;

  const pair = Math.random() < 0.5 ? [correct, wrong] : [wrong, correct];

  bopomofoEl.textContent = correct.bopomofo;
  choiceA.textContent = pair[0].text;
  choiceB.textContent = pair[1].text;

  message.textContent = "";
}

function choose(btn) {
  if (locked) return;
  locked = true;

  getAudioCtx();

  if (btn.textContent === answer.text) {
    btn.classList.add("correct");
    message.textContent = "🎉 答對了！好棒！";
    score++;
    scoreEl.textContent = score;
    playCorrectSound();
  } else {
    btn.classList.add("wrong");
    const correctBtn = choiceA.textContent === answer.text ? choiceA : choiceB;
    correctBtn.classList.add("correct");
    message.textContent = "💨 答錯囉！正確答案是「" + answer.text + "」";
    playWrongSound();
  }


}

choiceA.addEventListener("click", () => choose(choiceA));
choiceB.addEventListener("click", () => choose(choiceB));

nextBtn.addEventListener("click", () => {
  getAudioCtx();
  newQuestion();
});

const strokeButtons = document.querySelectorAll(".stroke-btn");
strokeButtons.forEach(button => {
  button.addEventListener("click", () => {
    currentMaxStrokes = button.dataset.maxStrokes;
    strokeButtons.forEach(option => {
      option.setAttribute("aria-pressed", String(option === button));
    });
    refreshActivePools();
    stopCorrectSound();
    stopWrongSound();
    newQuestion();
  });
});

const gradeButtons = document.querySelectorAll(".grade-btn");
gradeButtons.forEach(button => {
  button.addEventListener("click", () => {
    currentGrade = Number(button.dataset.grade);
    gradeButtons.forEach(option => {
      option.setAttribute("aria-pressed", String(option === button));
    });
    poolHint.textContent = currentGrade === 1
      ? "一年級字彙・依筆畫範圍隨機出題"
      : "二年級字彙・依筆畫範圍隨機出題";
    refreshActivePools();
    stopCorrectSound();
    stopWrongSound();
    newQuestion();
  });
});

soundBtn.addEventListener("click", () => {
  getAudioCtx();
  soundOn = !soundOn;
  if (!soundOn) {
    stopWrongSound();
    stopCorrectSound();
  }
  soundBtn.textContent = soundOn ? "🔊" : "🔇";
  soundBtn.setAttribute("aria-label", soundOn ? "關閉音效" : "開啟音效");
  soundBtn.title = soundOn ? "關閉音效" : "開啟音效";
});

newQuestion();
</script>

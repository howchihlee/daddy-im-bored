function pick(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return a.sort(()=>Math.random()-.5)}

function changeTarget(){target=pick(pool.filter(x=>x!==target));$('target').classList.remove('pop');void $('target').offsetWidth;$('target').classList.add('pop');$('announce').textContent='第 '+round+' 回合，請聽發音並找出地鼠手上的注音';playPrompt()}
function wave(){const version=++waveVersion;hide();const slots=shuffle([...Array(9).keys()]).slice(0,3),correct=pick(slots);slots.forEach(i=>{const h=holes[i];h.symbol=i===correct?target:pick(pool.filter(x=>x!==target));h.letter.textContent=h.symbol;h.button.setAttribute('aria-label','地洞 '+(i+1)+'，注音 '+h.symbol)});setTimeout(()=>{if(!running||version!==waveVersion)return;slots.forEach(i=>{const h=holes[i];h.active=true;h.button.disabled=paused;h.button.classList.add('up')})},240)}
let renderedPoopCount=-1;
function update(){if(renderedPoopCount!==poopCount){$('poopCount').textContent=poopCount;const bundles=Math.floor(poopCount/5),singles=poopCount%5;$('poopIcons').innerHTML=poopCount?'<span class="poop-bundle"><span class="poop-big">💩</span><span class="poop-five">5個</span></span>'.repeat(bundles)+'<span class="poop-icon">💩</span>'.repeat(singles):'<span class="poop-empty">還沒有大便，繼續保持！</span>';renderedPoopCount=poopCount}$('streak').textContent=streak;$('round').textContent=round}
function resultLine(count){if(count===0)return '地鼠說：今天的花園香香的，你的眼睛真厲害！';if(count<=2)return '地鼠揉揉鼻子：咦？這是哪裡飄來的小味道？';if(count<=5)return '地鼠趕緊捏住鼻子：哎呀，花園有點臭臭的！';if(count<=9)return '太臭了吧！地鼠聞到味道，暈倒了！';return '哇！臭味快飄出森林了，地鼠們全部暈倒啦！'}
function finish(){stopPrompt();running=false;paused=false;pendingAdvance=false;waveVersion++;hide();$('garden').classList.remove('resting');$('group').disabled=false;$('reset').hidden=true;$('start').textContent='再玩 10 回合 ↻';showOverlay(poopCount>=6?'😵':'🏁','10 回合完成！','這次獲得 <strong class="result-count">'+poopCount+' 個 💩</strong><br>'+resultLine(poopCount)+'<br>再來挑戰一次吧！','重新開始 ▶');$('message').textContent='🎉 完成 10 回合！這次有 '+poopCount+' 個大便。';$('announce').textContent='完成 10 回合，獲得 '+poopCount+' 個大便。'+resultLine(poopCount);resultVoice(poopCount)}
function advance(){pendingAdvance=false;if(round===10){finish();return}round++;changeTarget();update();wave()}
function hit(i){const h=holes[i];if(!running||paused||!h.active)return;if(h.symbol!==target){poopCount++;streak=0;h.active=false;h.button.disabled=true;h.button.classList.add('poop');h.letter.textContent='💩';h.button.setAttribute('aria-label','地洞 '+(i+1)+'，已變成大便');$('message').textContent='💩 哎呀，變成大便了！';stopPrompt();tone(false);poopVoice();update();return}streak++;holes.forEach(x=>{x.active=false;x.button.disabled=true});h.button.classList.add('hit');stopPrompt();tone(true);const feedback=document.createElement('span');feedback.className='float';feedback.textContent='✓';h.wrap.append(feedback);setTimeout(()=>feedback.remove(),800);$('message').textContent=streak>=3?'✨ 太棒了！已經連續答對 '+streak+' 次！':'🌼 答對了！一起進入下一回合！';update();const version=waveVersion;setTimeout(()=>{if(!running||version!==waveVersion)return;if(paused)pendingAdvance=true;else advance()},550)}
function start(){stopPrompt();stopVoice();pool=groups[$('group').value];poopCount=streak=0;round=1;running=true;paused=false;pendingAdvance=false;$('garden').classList.remove('resting');$('group').disabled=true;$('reset').hidden=false;$('start').textContent='暫停一下 Ⅱ';$('overlay').hidden=true;changeTarget();$('message').textContent='👂 聽一聽發音，找出拿著對應注音的地鼠！';update();wave()}
function pause(){if(!running)return;paused=!paused;$('garden').classList[paused?'add':'remove']('resting');$('start').textContent=paused?'繼續玩耍 ▶':'暫停一下 Ⅱ';holes.forEach(h=>h.button.disabled=paused||!h.active);if(paused){stopPrompt();showOverlay('🍃','休息一下下','這一回合會留在原地，<br>準備好了就繼續玩吧！','繼續玩耍 ▶')}else{$('overlay').hidden=true;if(pendingAdvance)advance();else playPrompt()}}
function showOverlay(emoji,title,text,button){$('emoji').textContent=emoji;$('overlayTitle').textContent=title;$('overlayText').innerHTML=text;$('overlayButton').textContent=button;$('overlay').hidden=false}
$('target').onclick=playPrompt;$('start').onclick=()=>running?pause():start();$('overlayButton').onclick=()=>running&&paused?pause():start();$('reset').onclick=()=>{stopPrompt();stopVoice();running=false;paused=false;$('garden').classList.remove('resting');waveVersion++;hide();$('group').disabled=false;$('reset').hidden=true;$('start').textContent='開始玩耍 ▶';showOverlay('🌱','換個玩法，再出發！','可以更換練習範圍，<br>準備好就開始吧！','開始玩耍 ▶')};$('sound').onclick=()=>{sound=!sound;if(!sound)stopVoice();$('sound').textContent=sound?'♪':'♩';$('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?'關閉音效':'開啟音效');$('sound').style.opacity=sound?'1':'.45'};
document.addEventListener('keydown',e=>{if(/SELECT|BUTTON/.test(e.target.tagName)||e.repeat)return;if(e.code==='Space'&&running){e.preventDefault();pause()}if(/^[1-9]$/.test(e.key))hit(Number(e.key)-1)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});
// Decorations never receive pointer events or alter the round state.
const meadow=$('gardenDecor'),bugLayer=$('gardenBugs');
const flowerColors=['#fffdf0','#f6bdc3','#ffe394','#d3c3e9'];
function plantArt(flower,color){return '<svg viewBox="0 0 40 58" xmlns="http://www.w3.org/2000/svg"><path d="M21 56Q25 37 20 20" fill="none" stroke="#719751" stroke-width="2.5" stroke-linecap="round"/><path d="M23 46Q7 45 8 33Q22 32 23 46M23 38Q23 26 35 27Q36 37 23 38" fill="#8eb169"/>'+(flower?'<g fill="'+color+'" stroke="#fff9e6" stroke-width=".6"><ellipse cx="20" cy="10" rx="5" ry="9"/><ellipse cx="29" cy="17" rx="9" ry="5" transform="rotate(-20 29 17)"/><ellipse cx="25" cy="26" rx="5" ry="9" transform="rotate(-30 25 26)"/><ellipse cx="14" cy="25" rx="5" ry="9" transform="rotate(30 14 25)"/><ellipse cx="10" cy="16" rx="9" ry="5" transform="rotate(20 10 16)"/></g><circle cx="20" cy="19" r="5.5" fill="#e5b755"/><circle cx="18.5" cy="17.5" r="1.5" fill="#fff0a5"/>':'<path d="M20 27Q5 26 8 16Q18 15 20 27M20 21Q20 9 31 9Q34 20 20 21" fill="#93b36c"/>')+'</svg>'}
const plantSpots=[[3,24],[97,20],[3,57],[97,59],[3,94],[96,96],[17,99],[76,99],[32,37],[65,37],[33,69],[67,69],[82,9],[58,8]];
plantSpots.forEach(([x,y],i)=>{const el=document.createElement('span');el.className='plant';el.style.left=x+'%';el.style.top=y+'%';el.innerHTML=plantArt(i%4!==3,flowerColors[i%4]);meadow.append(el)});
[[12,34],[51,36],[85,35],[15,67],[50,68],[88,68],[35,98],[60,98],[94,43],[7,76]].forEach(([x,y])=>{const el=document.createElement('span');el.className='plant grass-patch';el.style.left=x+'%';el.style.top=y+'%';el.innerHTML='<svg viewBox="0 0 45 30" xmlns="http://www.w3.org/2000/svg"><path d="M21 29Q14 13 4 12Q14 12 18 22Q16 8 19 2Q24 12 23 22Q29 9 37 9Q30 19 28 28Q35 20 43 23Q35 24 32 29Z" fill="#83a960"/></svg>';meadow.append(el)});
for(let i=0;i<32;i++){const dot=document.createElement('i');dot.className='meadow-dot';dot.style.left=(3+Math.random()*94)+'%';dot.style.top=(7+Math.random()*90)+'%';meadow.append(dot)}
const ladybugColors=[['#e97052','#bb513b','#a84735','#ffbe8f'],['#e7a942','#ae722a','#9a682e','#ffe0a0'],['#64b9a5','#378c78','#317968','#b3eee0'],['#a98bcf','#735a9b','#76509b','#dacaf4'],['#7298d8','#496da9','#465d94','#c1d4f6'],['#e78bb2','#b95984','#a95179','#ffd0e2']];
function bugArt(ant){return ant?'<svg viewBox="0 0 46 30" xmlns="http://www.w3.org/2000/svg"><g class="bug-legs" fill="none" stroke="#644b38" stroke-width="1.9" stroke-linecap="round"><path d="M19 13L15 5L10 3M23 13L24 5L29 3M27 14L32 8L37 8M19 17L15 25L10 27M23 17L24 25L29 27M27 16L32 22L37 22"/></g><ellipse cx="11" cy="15" rx="9" ry="7" fill="#76543d"/><ellipse cx="23" cy="15" rx="6" ry="5" fill="#956d4d"/><circle cx="34" cy="15" r="7" fill="#79553d"/><path d="M37 10L40 4L44 3M40 13L45 9" fill="none" stroke="#644b38" stroke-width="1.5" stroke-linecap="round"/><circle cx="36" cy="12" r="1.5" fill="#fff8db"/><circle cx="36.5" cy="12" r=".7" fill="#382e24"/><path d="M7 11Q9 9 12 10" fill="none" stroke="#ae8966" stroke-width="2" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 40 36" xmlns="http://www.w3.org/2000/svg"><g class="bug-legs" fill="none" stroke="#4f4435" stroke-width="2" stroke-linecap="round"><path d="M12 11L9 5M19 10L20 3M25 12L29 6M12 25L9 31M19 26L20 33M25 24L29 30"/></g><ellipse cx="29" cy="18" rx="8" ry="8" fill="#493f32"/><ellipse cx="18" cy="18" rx="14" ry="12" fill="#e97052" stroke="#bb513b" stroke-width="1.5"/><path d="M5 18H31" stroke="#a84735" stroke-width="1.5"/><g fill="#593f32"><circle cx="13" cy="12" r="3"/><circle cx="23" cy="11" r="2.4"/><circle cx="13" cy="24" r="3"/><circle cx="23" cy="25" r="2.4"/></g><path d="M9 10Q13 7 17 8" stroke="#ffbe8f" stroke-width="2.3" stroke-linecap="round" fill="none"/><circle cx="33" cy="14" r="1.6" fill="#fff9e0"/><circle cx="33" cy="22" r="1.6" fill="#fff9e0"/><path d="M34 12L38 8M34 24L38 28" stroke="#493f32" stroke-width="1.5" stroke-linecap="round"/></svg>'}
let activeBugs=0;const motionPreference=window.matchMedia?.('(prefers-reduced-motion: reduce)');
function spawnBug(){if(document.hidden||paused||motionPreference?.matches||activeBugs>=3)return;const ant=Math.random()<.48,bug=document.createElement('span');bug.className='wanderer'+(ant?' ant':'');const reverse=Math.random()<.5,vertical=Math.random()<.35;let sx,sy,ex,ey;
if(vertical){sx=ex=Math.random()<.5?1:94;sy=reverse?106:-8;ey=reverse?-8:106}else{sx=reverse?106:-8;ex=reverse?-8:106;sy=ey=[4,35,66,94][Math.floor(Math.random()*4)]}
const seconds=ant?15+Math.random()*7:18+Math.random()*8,mx=(sx+ex)/2+(vertical?Math.random()*3-1.5:0),my=(sy+ey)/2+(vertical?0:Math.random()*3-1.5),angle=vertical?(reverse?-90:90):(reverse?180:0);
Object.entries({'--sx':sx+'%','--sy':sy+'%','--ex':ex+'%','--ey':ey+'%','--mx':mx+'%','--my':my+'%','--heading':angle+'deg','--walk-time':seconds+'s'}).forEach(([k,v])=>bug.style.setProperty(k,v));let artwork=bugArt(ant);if(!ant){const colors=pick(ladybugColors);['#e97052','#bb513b','#a84735','#ffbe8f'].forEach((base,i)=>{artwork=artwork.replaceAll(base,colors[i])})}bug.innerHTML='<span class="bug-body" style="display:block">'+artwork+'</span>';bugLayer.append(bug);activeBugs++;bug.addEventListener('animationend',e=>{if(e.target===bug){bug.remove();activeBugs--}},{once:true})}
function scheduleBug(){spawnBug();setTimeout(scheduleBug,4500+Math.random()*5500)}
setTimeout(scheduleBug,1200);

})();

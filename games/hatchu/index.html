<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hatchu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
  :root{
    --sky-top:#1c1440;
    --sky-mid:#2b2158;
    --sky-low:#4a3a7d;
    --grass:#3e8e7e;
    --grass-dark:#2f6f63;
    --egg:#fff3dd;
    --egg-shade:#f0ddb8;
    --speckle:#d9bd8e;
    --glow:#ffd97d;
    --accent:#ff8fa3;
    --ink:#fdf6ec;
    --ink-dim:#b9aee0;
    --card:#332a5e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-low) 78%);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;flex-direction:column;align-items:center;
  }

  /* ---------- sky ---------- */
  .star{
    position:absolute;border-radius:50%;
    background:#fff8e7;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.25;transform:scale(.8)}
    50%{opacity:.9;transform:scale(1.1)}
  }
  .moon{
    position:absolute;top:7%;right:9%;
    width:64px;height:64px;border-radius:50%;
    background:#ffeec2;
    box-shadow:0 0 40px 8px rgba(255,238,194,.35);
  }
  .moon::after{
    content:"";position:absolute;left:-10px;top:-4px;
    width:56px;height:56px;border-radius:50%;
    background:var(--sky-top);
  }

  /* ---------- ground ---------- */
  .hill{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:170vmax;height:34vh;
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    background:linear-gradient(180deg,var(--grass) 0%,var(--grass-dark) 70%);
  }
  .hill::before{
    content:"";position:absolute;inset:0;
    border-radius:inherit;
    background:radial-gradient(60% 40% at 50% 0%,rgba(255,217,125,.18),transparent 70%);
  }

  /* ---------- header ---------- */
  header{
    position:relative;z-index:3;
    padding:clamp(16px,3vh,28px) 24px 0;
    text-align:center;
  }
  h1{
    margin:0;
    font-family:"Fredoka",system-ui,sans-serif;
    font-weight:600;
    font-size:clamp(28px,5vmin,44px);
    letter-spacing:.02em;
    text-wrap:balance;
    color:var(--ink);
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  h1 .dot{color:var(--accent)}
  .tagline{
    margin:6px 0 0;
    font-size:clamp(13px,2.2vmin,16px);
    color:var(--ink-dim);
  }

  /* ---------- nest area ---------- */
  #nest{
    position:relative;z-index:2;
    flex:1;min-height:0;
    width:100%;
    display:flex;align-items:center;justify-content:center;
  }
  #eggWrap{
    position:relative;
    height:min(56vmin,360px,100%);
    aspect-ratio:5/6;
    max-width:88vw;
    cursor:pointer;
    outline:none;
  }
  #eggWrap:focus-visible{
    border-radius:50%;
    box-shadow:0 0 0 4px rgba(255,217,125,.7);
  }
  #eggGlow{
    position:absolute;inset:-14%;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,217,125,.28),transparent 65%);
    opacity:0;transition:opacity .5s;
    pointer-events:none;
  }
  #eggSvg{width:100%;height:100%;display:block;transform-origin:50% 88%}
  .wobble #eggSvg{animation:wobble .45s ease}
  .wobble-big #eggSvg{animation:wobbleBig .5s ease}
  @keyframes wobble{
    0%{transform:rotate(0)}25%{transform:rotate(-6deg)}
    55%{transform:rotate(5deg)}80%{transform:rotate(-2deg)}100%{transform:rotate(0)}
  }
  @keyframes wobbleBig{
    0%{transform:rotate(0) translateY(0)}
    20%{transform:rotate(-9deg) translateY(-4%)}
    45%{transform:rotate(8deg)}
    65%{transform:rotate(-6deg) translateY(-2%)}
    85%{transform:rotate(4deg)}
    100%{transform:rotate(0)}
  }
  .crack{opacity:0;transition:opacity .18s}
  .crack.show{opacity:1}

  /* shell halves fly apart on hatch */
  #shellTop,#shellBottom{transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .7s}
  .hatched #shellTop{transform:translate(-34%,-80%) rotate(-38deg);opacity:0}
  .hatched #shellBottom{transform:translate(30%,42%) rotate(28deg);opacity:0}

  /* the monster */
  #monster{
    position:absolute;inset:6% 8% 4% 8%;
    display:flex;align-items:flex-end;justify-content:center;
    transform:scale(0);transform-origin:50% 92%;
    pointer-events:none;
  }
  #monster svg{width:100%;height:100%}
  .hatched #monster{animation:popIn .8s cubic-bezier(.34,1.7,.5,1) .15s forwards}
  @keyframes popIn{
    0%{transform:scale(0)}
    60%{transform:scale(1.12)}
    80%{transform:scale(.96)}
    100%{transform:scale(1)}
  }
  .hatched.settled #monster{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{
    0%,100%{transform:scale(1) translateY(0)}
    50%{transform:scale(1.02,0.98) translateY(1.5%)}
  }

  /* ---------- blinking ---------- */
  .blink{
    transform-box:fill-box;transform-origin:center;
    animation:blink 4.4s infinite;
  }
  @keyframes blink{
    0%,91.5%,96.5%,100%{transform:scaleY(1)}
    93%,95%{transform:scaleY(.08)}
  }

  /* ---------- per-creature idle personalities ---------- */
  .hatched.settled #monster[data-idle="drift"]{animation:drift 5.5s ease-in-out infinite}
  .hatched.settled #monster[data-idle="jelly"]{animation:jelly 2s ease-in-out infinite}
  .hatched.settled #monster[data-idle="jitter"]{animation:jitter .8s steps(2,end) infinite}
  .hatched.settled #monster[data-idle="ghost"]{animation:ghostFloat 3.8s ease-in-out infinite}
  .hatched.settled #monster[data-idle="hop"]{animation:hop 2.4s ease-in-out infinite}
  .hatched.settled #monster[data-idle="munch"]{animation:munch 5s ease-in-out infinite}
  .hatched.settled #monster[data-idle="soar"]{animation:soar 3.6s ease-in-out infinite}
  .hatched.settled #monster[data-idle="spin"]{transform-origin:50% 59%;animation:spinRock 6s ease-in-out infinite}
  /* terra: takeoff attempt during the wing flaps (same 3.6s clock), clumsy landing */
  @keyframes soar{
    0%,50%,100%{transform:translateY(0)}
    60%,72%{transform:translateY(-6%)}
    80%{transform:translateY(-4%)}
    88%{transform:translateY(1.5%)}
    94%{transform:translateY(-.8%)}
  }
  /* pebble: long nap, then one quick barrel roll — fastest rock in the meadow */
  @keyframes spinRock{
    0%,68%{transform:rotate(0)}
    84%,100%{transform:rotate(360deg)}
  }
  /* chews land at 22–50%, while the snack (same 5s clock) shrinks at 24–52% */
  @keyframes munch{
    0%,60%,100%{transform:scale(1) translateY(0)}
    12%{transform:scale(1.01,.99) translateY(.5%)}
    22%,30%,38%,46%{transform:scale(1.05,.93) translateY(1.2%)}
    26%,34%,42%,50%{transform:scale(.99,1.02) translateY(0)}
  }
  @keyframes drift{
    0%,100%{transform:translateX(-3%) translateY(0)}
    50%{transform:translateX(3%) translateY(-2.5%)}
  }
  @keyframes jelly{
    0%,100%{transform:scale(1.04,.96)}
    50%{transform:scale(.97,1.05)}
  }
  @keyframes jitter{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(1.2%,-.8%)}
    50%{transform:translate(-1%,.6%)}
    75%{transform:translate(.6%,1%)}
  }
  @keyframes ghostFloat{
    0%,100%{transform:translateY(0);opacity:1}
    50%{transform:translateY(-5%);opacity:.72}
  }
  @keyframes hop{
    0%,55%,100%{transform:translateY(0) scale(1)}
    65%{transform:translateY(-7%) scale(.98,1.04)}
    75%{transform:translateY(0) scale(1.06,.94)}
    85%{transform:translateY(0) scale(1)}
  }

  /* animated parts inside the hatched monster (wings, leaves, inner flame) */
  #monster .wing-l,#monster .wing-r,#monster .leaf-l,#monster .leaf-r,#monster .flicker,#monster .snack,#monster .bolt,#monster .sprout-top{transform-box:fill-box}
  /* nimbus: lightning double-flash, on the same 5.5s clock as the drift idle */
  #monster .bolt{transform-origin:50% 0%;opacity:0;animation:boltFlash 5.5s linear infinite}
  @keyframes boltFlash{
    0%,54%{opacity:0;transform:scaleY(.3)}
    56%{opacity:1;transform:scaleY(1)}
    60%{opacity:.15;transform:scaleY(1)}
    62%{opacity:1;transform:scaleY(1)}
    69%,100%{opacity:0;transform:scaleY(1)}
  }
  /* sprout: the head sprout grows from a bud, settles, then a new one starts */
  #monster .sprout-top{transform-origin:50% 100%;animation:sproutGrow 6s ease-in-out infinite}
  @keyframes sproutGrow{
    0%{transform:scale(.15)}
    55%{transform:scale(1.08)}
    70%{transform:scale(.96)}
    80%,100%{transform:scale(1)}
  }

  /* ---------- signature idle events, one per creature ---------- */
  /* ephemeral bits are invisible until their moment; tray icons hide them */
  #monster .spark,#monster .note,#monster .zap,#monster .drip,#monster .tw,#monster .bub{opacity:0}
  .slot .spark,.slot .note,.slot .zap,.slot .drip,.slot .tw,.slot .bigflame{display:none}
  #monster .zap,#monster .tw,#monster .ear-l,#monster .ear-r,#monster .arm-l,#monster .arm-r,#monster .plate{transform-box:fill-box}

  /* ember: a big flame flares up behind her and fades away */
  #monster .bigflame{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:bigFlame 5.2s ease-in-out infinite}
  @keyframes bigFlame{
    0%,55%{opacity:0;transform:scale(.55)}
    64%{opacity:.85;transform:scale(.92)}
    72%{opacity:.65;transform:scale(1)}
    88%,100%{opacity:0;transform:scale(1.12)}
  }

  /* ember: sparks rise off the flame */
  #monster .spark{animation:sparkRise 3.9s linear infinite}
  #monster .s2{animation-delay:1.3s}
  #monster .s3{animation-delay:2.6s}
  @keyframes sparkRise{
    0%{opacity:0;transform:translateY(0)}
    8%{opacity:.9}
    30%,100%{opacity:0;transform:translateY(-30px)}
  }

  /* pip chirps a note after landing; luna hums slow ones from either side */
  #monster .note{animation:floatNote 2.4s ease-out infinite}
  #monster .n1,#monster .n2{animation-duration:5.2s}
  #monster .n2{animation-delay:2.6s}
  @keyframes floatNote{
    0%,60%{opacity:0;transform:translateY(0)}
    68%{opacity:1}
    96%,100%{opacity:0;transform:translateY(-24px)}
  }

  /* ziggy: static discharges at the star tips */
  #monster .zap{animation:zapFlash 3.2s linear infinite}
  #monster .z2{animation-delay:1.6s}
  @keyframes zapFlash{
    0%,62%{opacity:0;transform:scale(.6)}
    64%{opacity:1;transform:scale(1)}
    67%{opacity:.1}
    70%{opacity:1;transform:scale(1.25)}
    74%,100%{opacity:0;transform:scale(.6)}
  }

  /* puddle: a bead of water slides down its side */
  #monster .drip{animation:dripSlide 4.2s ease-in infinite}
  @keyframes dripSlide{
    0%,55%{opacity:0;transform:translateY(0)}
    62%{opacity:.95;transform:translateY(4px)}
    85%{opacity:.95;transform:translateY(46px)}
    94%,100%{opacity:0;transform:translateY(52px)}
  }

  /* boo: shy sparkles, on the same clock as his fade-float */
  #monster .tw{animation:ghostTwinkle 3.8s ease-in-out infinite}
  #monster .t2{animation-delay:1.9s}
  @keyframes ghostTwinkle{
    0%,40%{opacity:0;transform:scale(.2) rotate(0deg)}
    50%{opacity:1;transform:scale(1) rotate(25deg)}
    62%,100%{opacity:0;transform:scale(.2) rotate(50deg)}
  }

  /* fang: ears twitch, listening in the dark (offset from the wing flaps) */
  #monster .ear-l,#monster .ear-r{transform-origin:50% 100%;animation:earTwitch 3.6s linear infinite}
  #monster .ear-r{animation-delay:.12s}
  @keyframes earTwitch{
    0%,20%,36%,100%{transform:rotate(0)}
    24%{transform:rotate(-13deg)}
    28%{transform:rotate(6deg)}
    32%{transform:rotate(-7deg)}
  }

  /* coral: her bubbles rise and pop */
  #monster .bub{animation:bubRise 4.5s ease-out infinite}
  #monster .b2{animation-delay:1.5s}
  #monster .b3{animation-delay:3s}
  @keyframes bubRise{
    0%,20%{opacity:0;transform:translateY(6px)}
    32%{opacity:.9}
    70%{opacity:.9;transform:translateY(-14px)}
    82%,100%{opacity:0;transform:translateY(-18px)}
  }

  /* rex: tries to clap. cannot. */
  #monster .arm-l{transform-origin:100% 0%;animation:clapL 4.4s ease-in-out infinite}
  #monster .arm-r{transform-origin:0% 0%;animation:clapR 4.4s ease-in-out infinite}
  @keyframes clapL{
    0%,55%,78%,100%{transform:rotate(0)}
    62%{transform:rotate(-26deg)}
    66%{transform:rotate(-6deg)}
    71%{transform:rotate(-26deg)}
  }
  @keyframes clapR{
    0%,55%,78%,100%{transform:rotate(0)}
    62%{transform:rotate(26deg)}
    66%{transform:rotate(6deg)}
    71%{transform:rotate(26deg)}
  }

  /* spike: solar plates pulse as they charge, one after another */
  #monster .plate{transform-origin:50% 100%;animation:platePulse 4.5s ease-in-out infinite}
  #monster .p2{animation-delay:.5s}
  #monster .p3{animation-delay:1s}
  @keyframes platePulse{
    0%,24%,100%{transform:scale(1)}
    12%{transform:scale(1.09)}
  }
  /* mochi's snack: lift to mouth, three shrinking bites, then a fresh one pops in */
  #monster .snack{transform-origin:center;animation:munchSnack 5s ease-in-out infinite}
  @keyframes munchSnack{
    0%,10%{transform:translate(0,0) scale(1)}
    20%,24%{transform:translate(-38px,-40px) scale(1)}
    30%,32%{transform:translate(-38px,-40px) scale(.7)}
    38%,40%{transform:translate(-38px,-40px) scale(.45)}
    46%{transform:translate(-38px,-40px) scale(.2)}
    52%,80%{transform:translate(-38px,-40px) scale(0)}
    86%{transform:translate(0,0) scale(0)}
    94%,100%{transform:translate(0,0) scale(1)}
  }
  #monster .wing-l{transform-origin:88% 35%;animation:flapL 3.6s ease-in-out infinite}
  #monster .wing-r{transform-origin:12% 35%;animation:flapR 3.6s ease-in-out infinite}
  #monster .leaf-l{transform-origin:100% 100%;animation:sway 3.2s ease-in-out infinite}
  #monster .leaf-r{transform-origin:0% 100%;animation:sway 3.2s ease-in-out infinite reverse}
  #monster .flicker{transform-origin:50% 100%;animation:flicker 1.3s ease-in-out infinite}
  @keyframes flapL{
    0%,50%,100%{transform:rotate(0)}
    60%{transform:rotate(-16deg)}70%{transform:rotate(5deg)}80%{transform:rotate(-10deg)}
  }
  @keyframes flapR{
    0%,50%,100%{transform:rotate(0)}
    60%{transform:rotate(16deg)}70%{transform:rotate(-5deg)}80%{transform:rotate(10deg)}
  }
  @keyframes sway{
    0%,100%{transform:rotate(-5deg)}
    50%{transform:rotate(6deg)}
  }
  @keyframes flicker{
    0%,100%{transform:scale(1);opacity:.85}
    30%{transform:scale(1.1,.92);opacity:.68}
    60%{transform:scale(.94,1.08);opacity:.95}
  }

  #hint{
    position:relative;z-index:3;
    min-height:2.4em;
    font-size:clamp(14px,2.4vmin,17px);
    color:var(--ink-dim);
    text-align:center;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
  #hint.solid{animation:none;opacity:1;color:var(--ink)}

  /* ---------- reveal card ---------- */
  #reveal{
    position:relative;z-index:3;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    opacity:0;transform:translateY(10px);
    transition:opacity .5s .5s,transform .5s .5s;
    pointer-events:none;
  }
  #reveal.show{opacity:1;transform:none;pointer-events:auto}
  #monsterName{
    margin:0;
    font-family:"Fredoka",system-ui,sans-serif;
    font-weight:600;
    font-size:clamp(22px,4.4vmin,34px);
    color:var(--glow);
    text-shadow:0 2px 0 rgba(0,0,0,.3);
  }
  #monsterBio{
    margin:0;max-width:38ch;text-align:center;
    font-size:clamp(13px,2.2vmin,16px);
    color:var(--ink-dim);
    padding:0 20px;
  }
  #newBadge{
    font-size:12px;font-weight:700;letter-spacing:.12em;
    color:#231a4a;background:var(--glow);
    padding:3px 10px;border-radius:999px;
  }
  #newBadge[hidden]{display:none!important}
  #again{
    margin-top:4px;
    font:600 clamp(15px,2.4vmin,17px) "Fredoka",system-ui,sans-serif;
    letter-spacing:.03em;
    color:#3a1622;background:var(--accent);
    border:none;border-radius:999px;
    padding:12px 26px;cursor:pointer;
    box-shadow:0 4px 0 #c95d74;
    transition:transform .12s,box-shadow .12s;
  }
  #again:hover{transform:translateY(-2px);box-shadow:0 6px 0 #c95d74}
  #again:active{transform:translateY(2px);box-shadow:0 2px 0 #c95d74}
  #again:focus-visible{outline:3px solid var(--glow);outline-offset:2px}

  /* ---------- collection tray ---------- */
  #tray{
    position:relative;z-index:3;
    width:100%;
    display:flex;gap:clamp(4px,1.4vmin,12px);
    padding:12px 12px calc(14px + env(safe-area-inset-bottom));
    align-items:center;justify-content:center;flex-wrap:wrap;
  }
  .slot{
    width:clamp(32px,9vw,54px);height:clamp(32px,9vw,54px);
    flex-shrink:0;padding:0;
    border-radius:50%;
    background:var(--card);
    border:2px solid rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;
    font-family:"Fredoka",sans-serif;font-size:18px;color:var(--ink-dim);
    overflow:hidden;
    transition:transform .3s,border-color .3s;
    cursor:default;
  }
  .slot.found{cursor:pointer}
  .slot.found:hover{transform:scale(1.12)}
  .slot.found:active{transform:scale(.95)}
  .slot:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
  .slot svg{width:86%;height:86%}
  .slot.found{border-color:var(--glow);background:#3d3370}
  .slot.just-found{animation:slotPop .5s cubic-bezier(.34,1.6,.5,1)}
  @keyframes slotPop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  #trayLabel{
    width:100%;text-align:center;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:2px;
  }

  #confetti{position:fixed;inset:0;z-index:4;pointer-events:none}

  /* ---------- small phones ---------- */
  @media (max-width:480px){
    header{padding-left:16px;padding-right:16px}
    .moon{width:44px;height:44px;top:5%;right:7%}
    .moon::after{width:38px;height:38px;left:-8px;top:-3px}
    #reveal{gap:8px}
  }
  /* short screens (small phones & landscape) */
  @media (max-height:640px){
    header{padding-top:10px}
    .tagline{margin-top:2px}
    #hint{min-height:1.6em}
    #reveal{gap:6px}
    #again{padding:10px 22px}
    #tray{padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  }
  @media (max-height:460px){
    .tagline,#trayLabel{display:none}
    .hill{height:26vh}
  }

  @media (prefers-reduced-motion:reduce){
    .star,#hint,.hatched.settled #monster{animation:none}
    .wobble #eggSvg,.wobble-big #eggSvg{animation:none}
    .hatched #monster{animation:none;transform:scale(1)}
    #shellTop,#shellBottom{transition-duration:.1s}
    .hatched.settled #monster[data-idle]{animation:none}
    .blink,#monster .wing-l,#monster .wing-r,#monster .leaf-l,#monster .leaf-r,#monster .flicker,#monster .snack,#monster .sprout-top{animation:none}
    #monster .ear-l,#monster .ear-r,#monster .arm-l,#monster .arm-r,#monster .plate{animation:none}
    /* no flashing or popping for reduced-motion users: ephemerals stay hidden */
    #monster .bolt,#monster .spark,#monster .note,#monster .zap,#monster .drip,#monster .tw,#monster .bigflame{animation:none;opacity:0}
    #monster .bub{animation:none;opacity:.9}
  }

/* Character keepsakes and little stage performances */
#monster svg{overflow:visible;filter:drop-shadow(0 10px 6px #17122b33)}
#monster .keepsake{stroke-linejoin:round;stroke-linecap:round}
.slot .idle-scene{display:none}
#monster .idle-scene{pointer-events:none}
#monster .scene-bit{opacity:0;transform-box:fill-box;transform-origin:center}
#monster.performing .scene-bit{animation:littleStory 3.6s ease-in-out both;animation-delay:var(--delay,0s)}
#monster.performing .scene-ring{animation:storyRing 3.6s ease-out both}
#monster.performing .keepsake{animation:keepsakeWiggle 3.6s ease-in-out;transform-box:fill-box;transform-origin:center}
#monster .scene-ring{opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes littleStory{0%{opacity:0;transform:translate(0,18px) scale(.3) rotate(-18deg)}20%,38%{opacity:1;transform:translate(0,0) scale(1.15) rotate(8deg)}65%{opacity:1;transform:translate(var(--dx,12px),-20px) scale(1) rotate(-8deg)}100%{opacity:0;transform:translate(var(--dx,12px),-48px) scale(.4) rotate(22deg)}}

/* Responsive stage: keep controls reachable when browser bars or zoom reduce space. */
html{min-width:280px}
body{overflow:hidden}
#stage{
  height:100vh;height:100dvh;
  display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(260px,1fr) auto auto auto;
  align-items:stretch;justify-items:center;
  overflow-x:hidden;overflow-y:auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  overscroll-behavior-y:contain;
}
header{grid-row:1;width:100%}
#nest{grid-row:2;min-height:260px;align-self:stretch;padding:42px 20px 14px}
#eggWrap{
  height:clamp(200px,40vh,360px);height:clamp(200px,40dvh,360px);
  max-width:min(76vw,340px);max-height:100%;
  flex-shrink:0;
}
#hint{grid-row:3;width:100%;margin:0;padding:0 16px 8px;min-height:26px}
#reveal{grid-row:4;width:min(100%,540px);padding:0 16px 12px;gap:8px}
#monsterBio{max-width:42ch;padding:0;line-height:1.45}
#personality{max-width:100%;text-align:center;line-height:1.4;overflow-wrap:anywhere}
#idleCaption{max-width:min(80vw,320px);white-space:normal;line-height:1.35}
#again{min-height:44px}
#tray{
  grid-row:5;width:min(100%,1040px);max-height:150px;
  gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  align-content:flex-start;overflow-y:auto;touch-action:pan-y;
}
.slot{width:48px;height:48px;min-width:44px;min-height:44px}
#trayLabel{margin:0 0 2px}
@media(min-width:1100px) and (min-height:800px){
  #eggWrap{height:400px;max-width:360px}
  #nest{min-height:340px}
  .slot{width:52px;height:52px}
}
@media(max-width:480px){
  header{padding-top:14px}
  h1{font-size:30px}
  .tagline{font-size:13px}
  #tray{gap:6px;max-height:134px}
  .slot{width:44px;height:44px}
  #monsterName{font-size:27px}
  #monsterBio{font-size:14px}
  #idleCaption{font-size:12px}
}
/* Wide, short screens put the character beside its card. */
@media(min-width:600px) and (max-height:600px) and (orientation:landscape){
  #stage{grid-template-columns:minmax(0,1fr) minmax(240px,1fr);grid-template-rows:auto minmax(210px,1fr) auto auto;column-gap:8px}
  header{grid-column:1 / -1;padding-top:8px}
  h1{font-size:26px}
  .tagline{display:none}
  #nest{grid-column:1;grid-row:2;min-height:210px;padding:35px 16px 0}
  #eggWrap{height:clamp(175px,52dvh,280px);max-width:32vw}
  #hint{grid-column:1;grid-row:3;min-height:22px;font-size:13px}
  #reveal{grid-column:2;grid-row:2 / 4;align-self:center;padding:12px 20px 8px 0;gap:7px}
  #monsterName{font-size:27px}
  #monsterBio{font-size:13px}
  #personality{font-size:10px}
  #idleCaption{max-width:40vw;font-size:11px;padding:6px 10px}
  #tray{grid-column:1 / -1;grid-row:4;max-height:76px;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;padding-top:8px;scroll-padding:14px}
  #trayLabel{display:none}
  .slot{width:44px;height:44px}
}
/* Keep the collection outside the scrolling play area. */
#stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:0;overflow:hidden}
#playArea{
  position:relative;z-index:2;grid-row:1;width:100%;min-height:0;
  display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(260px,1fr) auto auto;
  justify-items:center;overflow-x:hidden;overflow-y:auto;
  overscroll-behavior-y:contain;scroll-padding-block:20px;
}
#collection{
  position:relative;z-index:3;grid-row:2;width:100%;min-width:0;
  padding:10px 0 env(safe-area-inset-bottom);
  background:#292248;border-top:1px solid #b9aee033;
  box-shadow:0 -8px 24px #17122b33;
}
#collection #trayLabel{display:block;margin:0;padding:0 12px 4px;line-height:1.4;letter-spacing:.08em}
#collection #tray{
  display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;
  width:min(100%,1040px);margin:auto;gap:8px;
  max-height:132px;max-height:min(132px,26dvh);min-height:64px;
  padding:8px 14px 12px;overflow-x:hidden;overflow-y:auto;
  touch-action:pan-y;overscroll-behavior:contain;scrollbar-gutter:stable both-edges;
  scroll-padding:8px;scrollbar-width:thin;scrollbar-color:#b9aee0 #332a5e;
}
#tray:focus-visible{outline:2px solid var(--glow);outline-offset:-3px}
#tray::-webkit-scrollbar{width:8px;height:8px}
#tray::-webkit-scrollbar-thumb{background:#b9aee0;border-radius:8px}
#tray::-webkit-scrollbar-track{background:#332a5e}
.star,.moon,.hill{pointer-events:none}
@media(min-width:600px) and (max-height:600px) and (orientation:landscape){
  #playArea{grid-template-columns:minmax(0,1fr) minmax(240px,1fr);grid-template-rows:auto minmax(210px,1fr) auto;column-gap:8px}
  #collection{padding-top:6px}
  #collection #tray{flex-wrap:nowrap;justify-content:flex-start;max-height:76px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x}
}

<script>
(function(){
  "use strict";

  /* ============ monster art: composed SVG cuties ============ */
  /* face helpers take o={y,spread,scale} so each creature's face sits differently */
  function eyes(type,color,o){
    o=o||{};
    var sp=o.spread||40, y=o.y||98, s=o.scale||1;
    var one;
    if(type==="happy") one='<path d="M-11 3 Q0 -7 11 3" stroke="'+color+'" stroke-width="5" stroke-linecap="round" fill="none"/>';
    else if(type==="sleepy") one='<path d="M-11 0 Q0 6 11 0" stroke="'+color+'" stroke-width="5" stroke-linecap="round" fill="none"/>';
    else if(type==="star") one='<path d="M0 -10 l3.5 7.5 8 1 -6 5.6 1.6 8 -7.1 -4.2 -7.1 4.2 1.6 -8 -6 -5.6 8 -1z" fill="'+color+'"/>';
    else one='<circle r="13" fill="#fff"/><circle cx="5" cy="2" r="7" fill="'+color+'"/><circle cx="7.5" cy="-.5" r="2.5" fill="#fff"/>';
    /* sleepy lids are already closed — no blink for them */
    var blink=(type==="sleepy")?"":' class="blink" style="animation-delay:-'+(Math.random()*4).toFixed(2)+'s"';
    return '<g transform="translate('+(100-sp)+' '+y+') scale('+s+')"><g'+blink+'>'+one+'</g></g>'+
      '<g transform="translate('+(100+sp)+' '+y+') scale(-'+s+' '+s+')"><g'+blink+'>'+one+'</g></g>';
  }
  function mouth(type,color,o){
    o=o||{};
    var y=o.y||124, s=o.scale||1, d;
    if(type==="open") d='<path d="M-12 0 Q0 16 12 0 Q0 8 -12 0Z" fill="'+color+'"/>';
    else if(type==="zig") d='<path d="M-16 2 l8 6 8 -6 8 6 8 -6" stroke="'+color+'" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    else if(type==="cat") d='<path d="M-14 0 Q-7 8 0 0 Q7 8 14 0" stroke="'+color+'" stroke-width="4.5" fill="none" stroke-linecap="round"/>';
    else if(type==="beak") d='<path d="M-10 -8 L10 -8 L0 8Z" fill="'+color+'"/>';
    else d='<path d="M-14 -2 Q0 12 14 -2" stroke="'+color+'" stroke-width="4.5" fill="none" stroke-linecap="round"/>';
    return '<g transform="translate(100 '+y+') scale('+s+')">'+d+'</g>';
  }
  function cheeks(o){
    o=o||{};
    var sp=o.spread||48, y=o.y||116, s=o.scale||1;
    return '<g fill="#ff9eb0" opacity=".55"><ellipse cx="'+(100-sp)+'" cy="'+y+'" rx="'+(10*s)+'" ry="'+(6.5*s)+'"/>'+

  }

  function body(shape,fill,stroke){
    if(shape==="drop") return '<path d="M100 22 C126 58 158 96 158 138 C158 176 132 200 100 200 C68 200 42 176 42 138 C42 96 74 58 100 22Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5"/>';

    if(shape==="dollop") return '<path d="M100 32 C134 32 156 62 156 100 C156 120 148 134 138 144 Q166 150 162 168 Q152 192 100 192 Q48 192 38 168 Q34 150 62 144 C52 134 44 120 44 100 C44 62 66 32 100 32Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5" stroke-linejoin="round"/>';
    if(shape==="flame") return '<path d="M100 22 Q118 44 108 62 C142 74 158 104 158 140 C158 174 132 196 100 196 C68 196 42 174 42 140 C42 104 58 74 92 62 Q82 44 100 22Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5" stroke-linejoin="round"/>';
    if(shape==="star") return '<path d="M100 36 L131 78 L180 94 L149 136 L149 188 L100 172 L51 188 L51 136 L20 94 L69 78Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5" stroke-linejoin="round"/>';
    if(shape==="pear") return '<path d="M100 36 C118 36 128 50 126 70 C154 82 166 114 164 144 C160 178 132 198 100 198 C68 198 40 178 36 144 C34 114 46 82 74 70 C72 50 82 36 100 36Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5" stroke-linejoin="round"/>';
    if(shape==="cloud") return '<path d="M34 132 C18 128 20 100 42 98 C40 72 72 60 88 74 C96 52 132 52 140 74 C158 62 182 78 176 100 C194 106 192 132 174 138 C186 160 162 178 142 168 C134 186 98 188 88 172 C72 186 40 178 42 158 C24 156 20 138 34 132Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5" stroke-linejoin="round"/>';
    if(shape==="boulder") return '<path d="M64 56 L140 50 L174 104 L164 170 L112 196 L50 176 L28 112Z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5" stroke-linejoin="round"/>';
    if(shape==="squat") return '<ellipse cx="100" cy="136" rx="80" ry="58" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5"/>';
    if(shape==="chunk") return '<rect x="46" y="52" width="108" height="146" rx="34" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5"/>';
    return '<ellipse cx="100" cy="132" rx="66" ry="66" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5"/>';
  }

  var MONSTERS=[
    {id:"boo",name:"Boo",bio:"A very shy ghost. Please pretend not to see him.",idle:"ghost",

        '<g fill="#e8b9d6"><ellipse cx="42" cy="102" rx="20" ry="29"/><ellipse cx="158" cy="102" rx="20" ry="29"/></g>'+
        '<rect x="53" y="133" width="94" height="59" rx="28" fill="#aaa7db" stroke="#7775a9" stroke-width="4"/>'+
        '<g fill="#d3cdf4" stroke="#7775a9" stroke-width="4"><rect x="53" y="169" width="33" height="30" rx="12"/><rect x="114" y="169" width="33" height="30" rx="12"/><ellipse cx="100" cy="103" rx="54" ry="59"/></g>'+
        '<path d="M88 48 Q84 31 99 39 Q98 22 108 43" fill="#d3cdf4" stroke="#7775a9" stroke-width="3" stroke-linecap="round"/>'+
        eyes("round","#49436f",{y:97,spread:28,scale:.9})+cheeks({y:115,spread:36,scale:.85})+
        '<g class="trunk"><path d="M89 116 C85 141 92 165 113 161 Q139 159 132 139" fill="none" stroke="#7775a9" stroke-width="24" stroke-linecap="round"/><path d="M89 116 C85 141 92 165 113 161 Q139 159 132 139" fill="none" stroke="#d3cdf4" stroke-width="17" stroke-linecap="round"/><path d="M84 130 L94 132 M87 141 L97 141" stroke="#aaa1d0" stroke-width="2" stroke-linecap="round"/></g>'; }},
    {id:"toilet",name:"Sir Flush",bio:"A porcelain prince. Makes a royal fuss over every little flush.",
      art:function(){return '<path d="M76 153 L124 153 L133 194 Q100 204 67 194Z" fill="#d8e9ee" stroke="#698c9d" stroke-width="4"/>'+
        '<rect x="51" y="38" width="98" height="95" rx="16" fill="#f4fbff" stroke="#698c9d" stroke-width="4"/>'+
        '<rect x="46" y="33" width="108" height="15" rx="7" fill="#d8e9ee" stroke="#698c9d" stroke-width="4"/>'+
        '<g class="flush-handle"><rect x="130" y="57" width="25" height="9" rx="4" fill="#ffd482" stroke="#aa8550" stroke-width="3"/></g>'+
        eyes("round","#3e6075",{y:79,spread:25,scale:.72})+cheeks({y:96,spread:33,scale:.7})+mouth("smile","#3e6075",{y:103,scale:.7})+
        '<path d="M35 128 Q39 179 100 180 Q161 179 165 128Z" fill="#f4fbff" stroke="#698c9d" stroke-width="4"/>'+
        '<ellipse cx="100" cy="128" rx="65" ry="23" fill="#deedf3" stroke="#698c9d" stroke-width="4"/>'+
        '<ellipse cx="100" cy="128" rx="48" ry="14" fill="#9fdbef" stroke="#78b5ce" stroke-width="3"/>'+
        '<g class="flush-swirl" fill="none" stroke="#f3fcff" stroke-width="3" stroke-linecap="round"><path d="M68 127 Q85 116 116 123 Q141 130 112 135 Q91 139 84 130 Q82 125 101 127"/></g>'+

"noodle":["Bubble-breathing legend", "Stand back! A fearsome\u2026 bubble.", "#c3e8ff", "\u25cb", "M0 0"],
"bloop":["Intergalactic rock walker", "Come on, Pebbles. Who is a good rock?", "#c4f0ac", "\u2726", "M0 0"],
"tumble":["Layer management specialist", "Achoo! Lettuce try that again.", "#d2ecac", "\u2727", "M0 0"],
"dumpling":["Chief dream counter", "One sheep. Two sheep. Me sheep. Zzz.", "#e0d0ff", "\u263e", "M0 0"],
"captainpuddle":["Admiral of the garden path", "SPLASH! The puddle splashed back.", "#b8e6ff", "\u25cc", "M0 0"],
"zip":["Overprepared adventure buddy", "I packed a small duck. It got bigger.", "#ffe698", "\u2726", "M0 0"],

    boo:['Brave-ish button collector','Boo! …was that too loud?','#dbcaff','✧','M75 145 L100 154 L125 145 L120 166 L100 173 L80 166Z'],
    nimbus:['Partly cloudy party planner','Forecast: a 100% chance of confetti.','#f9dca1','▰','M67 75 Q83 48 113 62 L124 79Z'],
    toilet:['His royal flushness','A royal whirlpool! Everybody stand back.','#b8edff','◌','M78 29 L74 11 L91 21 L100 5 L109 21 L126 11 L122 29Z'],
    coffee:['Small cup, big ambitions','A little latte art. A LOT of energy.','#ffddb3','♡','M73 161 L91 167 L100 162 L109 167 L127 161 L124 177 L109 173 L100 178 L91 173 L76 177Z'],
    elephant:['Pocket-sized brass section','PffffTOOT! Was that the quiet setting?','#f6d39c','♪','M58 165 L75 171 L88 165 L85 180 L73 176 L61 182Z'],
  };
  function keepsake(m){
    var p=personalities[m.id];
    var detail='<path d="'+p[4]+'" fill="'+p[2]+'" stroke="#483956" stroke-width="2.5"/>';
    if(m.id==='boo') detail+='<circle cx="114" cy="160" r="6" fill="#ffe3a1"/><path d="M112 158 L116 162 M116 158 L112 162" stroke="#8e799e" stroke-width="1.5"/>';
    return '<g class="keepsake">'+(p[4]==='M0 0'?'':detail)+'</g>';
  }
  function monsterSvg(m){
    var p=personalities[m.id], bits='';
    for(var j=0;j<7;j++){
      var x= j%2===0 ? 5+j*4 : 184-j*3, y=65+(j%4)*34;
      if(m.id==='nimbus'){x=35+j*22;y=184+(j%2)*15;}
      bits+='<text class="scene-bit" x="'+x+'" y="'+y+'" style="--delay:'+j*.16+'s;--dx:'+(j%2?18:-18)+'px" fill="'+p[2]+'" font-size="'+(18+j%3*5)+'" text-anchor="middle">'+p[3]+'</text>';
    }
    return '<svg viewBox="-16 -16 232 242" role="img" aria-label="'+m.name+' — '+p[0]+'"><g class="character-art" data-character="'+m.id+'">'+m.art()+keepsake(m)+'</g><g class="idle-scene" aria-hidden="true"><ellipse class="scene-ring" cx="100" cy="195" rx="73" ry="13" fill="none" stroke="'+p[2]+'" stroke-width="3"/>'+bits+'</g></svg>';
  }

  /* ============ tiny sounds (WebAudio, created on first tap) ============ */
  var actx=null;
  function tone(freq,start,dur,vol,type){
    try{
      var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+start;
      o.type=type||"triangle";o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g);g.connect(actx.destination);
      o.start(t);o.stop(t+dur+0.05);
    }catch(e){}
  }
  function ensureAudio(){
    if(actx) return;
    try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  }
  function knockSound(n){ if(!actx)return; tone(150+n*40,0,0.12,0.25,"square"); tone(90,0,0.15,0.2,"sine"); }
  function hatchSound(){ if(!actx)return;
    [523,659,784,1047].forEach(function(f,i){tone(f,i*0.09,0.35,0.22,"triangle");});
    tone(1319,0.4,0.5,0.12,"sine");
  }

  /* ============ stars ============ */
  var stage=document.getElementById("stage");
  for(var i=0;i<42;i++){
    var s=document.createElement("div");
    s.className="star";
    var sz=(Math.random()*2+1).toFixed(1);
    s.style.width=sz+"px";s.style.height=sz+"px";
    s.style.left=(Math.random()*100)+"%";
    s.style.top=(Math.random()*62)+"%";
    s.style.animationDelay=(Math.random()*3)+"s";
    s.style.animationDuration=(2.2+Math.random()*2.4)+"s";
    stage.appendChild(s);
  }

  /* ============ collection ============ */
  var KEY="hatchlings-collection";
  function loadFound(){
    try{var v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[];}catch(e){return [];}
  }
  function saveFound(list){ try{localStorage.setItem(KEY,JSON.stringify(list));}catch(e){} }
  var found=loadFound().filter(function(id){return MONSTERS.some(function(m){return m.id===id;});});

  var tray=document.getElementById("tray");
  document.getElementById("totalCount").textContent=MONSTERS.length;
  var slots={};
  MONSTERS.forEach(function(m){
    var d=document.createElement("button");
    d.type="button";
    d.className="slot";d.textContent="?";
    d.title="???";
    d.disabled=true;
    d.setAttribute("aria-label","Mystery hatchu");
    d.addEventListener("click",function(){
      if(d.classList.contains("found")) showMonster(m);
    });
    tray.appendChild(d);
    slots[m.id]=d;
  });
  function renderTray(newId){
    MONSTERS.forEach(function(m){
      var d=slots[m.id];
      if(found.indexOf(m.id)>=0 && !d.classList.contains("found")){
        d.classList.add("found");d.textContent="";
        d.title=m.name;
        d.disabled=false;
        d.setAttribute("aria-label","Visit "+m.name);
        d.innerHTML=monsterSvg(m);
        if(m.id===newId){d.classList.add("just-found");
          setTimeout(function(){d.classList.remove("just-found");},600);}
      }
    });
    document.getElementById("foundCount").textContent=found.length;
  }
  renderTray(null);

  /* ============ confetti ============ */
  var canvas=document.getElementById("confetti"),ctx=canvas.getContext("2d");
  var parts=[],confettiRunning=false;
  var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
  addEventListener("resize",resize);resize();
  var COLORS=["#ffd97d","#ff8fa3","#a8e6cf","#9cc9ff","#c3a6f2","#fff3dd"];
  function burstConfetti(){
    if(reduced) return;
    var cx=innerWidth/2,cy=innerHeight/2;
    for(var i=0;i<90;i++){
      var a=Math.random()*Math.PI*2,v=4+Math.random()*7;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,
        s:4+Math.random()*5,c:COLORS[i%COLORS.length],
        r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,life:1});
    }
    if(!confettiRunning){confettiRunning=true;requestAnimationFrame(tick);}
  }
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts=parts.filter(function(p){return p.life>0;});
    parts.forEach(function(p){
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.vx*=0.99;p.r+=p.vr;p.life-=0.011;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(p.life,0);
      ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
      ctx.restore();
    });
    if(parts.length){requestAnimationFrame(tick);}
    else{confettiRunning=false;ctx.clearRect(0,0,canvas.width,canvas.height);}
  }

  /* ============ game state ============ */
  var eggWrap=document.getElementById("eggWrap");
  var monsterEl=document.getElementById("monster");
  var glow=document.getElementById("eggGlow");
  var hint=document.getElementById("hint");
  var reveal=document.getElementById("reveal");
  var TAPS_NEEDED=3;
  var taps=0,hatched=false,current=null;

  var idleTimer=null,idleEnd=null;
  var caption=document.getElementById('idleCaption');
  function stopPersonality(){
    clearTimeout(idleTimer);clearTimeout(idleEnd);
    monsterEl.classList.remove('performing');caption.classList.remove('visible');
  }
  function startPersonality(m){
    stopPersonality();
    document.getElementById('personality').textContent=personalities[m.id][0];
    idleTimer=setTimeout(playIdle,2100);
  }
  function playIdle(){
    if(!hatched||!current||document.hidden)return;
    clearTimeout(idleTimer);clearTimeout(idleEnd);
    monsterEl.classList.remove('performing');void monsterEl.offsetWidth;
    monsterEl.classList.add('performing');
    caption.textContent=personalities[current.id][1];caption.classList.add('visible');
    eggWrap.setAttribute('aria-label','Play with '+current.name);
    idleEnd=setTimeout(function(){monsterEl.classList.remove('performing');caption.classList.remove('visible');},4700);
    idleTimer=setTimeout(playIdle,9000);
  }
  document.addEventListener('visibilitychange',function(){if(document.hidden)stopPersonality();else if(hatched&&current)startPersonality(current);});

  function pickMonster(){
    var unfound=MONSTERS.filter(function(m){return found.indexOf(m.id)<0;});
    /* gentle bias toward new friends, but repeats can happen once most are found */
    var pool=(unfound.length && Math.random()<0.85)?unfound:MONSTERS;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  var HINTS=["tap the egg","again! it's cracking…","one more tap!"];

  function onTap(){
    if(hatched){playIdle();return;}
    ensureAudio();
    taps++;
    knockSound(taps);
    var big=taps>=TAPS_NEEDED;
    eggWrap.classList.remove("wobble","wobble-big");
    void eggWrap.offsetWidth; /* restart animation */
    eggWrap.classList.add(big?"wobble-big":"wobble");
    var crack=document.getElementById("crack"+Math.min(taps,3));
    if(crack) crack.classList.add("show");
    glow.style.opacity=(taps/TAPS_NEEDED*0.9).toFixed(2);
    if(big){ hatch(); }
    else{ hint.textContent=HINTS[Math.min(taps,HINTS.length-1)]; }
  }

  function hatch(){
    hatched=true;
    var m=current=pickMonster();
    monsterEl.innerHTML=monsterSvg(m);
    startPersonality(m);
    if(m.idle) monsterEl.setAttribute("data-idle",m.idle);
    else monsterEl.removeAttribute("data-idle");
    var isNew=found.indexOf(m.id)<0;
    setTimeout(function(){
      eggWrap.classList.remove("wobble","wobble-big");
      eggWrap.classList.add("hatched");
      eggWrap.style.cursor="default";
      eggWrap.setAttribute("aria-label",m.name+" hatched!");
      hatchSound();
      burstConfetti();
      glow.style.opacity="1";
      hint.textContent="";
      document.getElementById("monsterName").textContent=m.name;
      document.getElementById("monsterBio").textContent=m.bio;
      document.getElementById("newBadge").hidden=!isNew;
      reveal.classList.add("show");
      if(isNew){found.push(m.id);saveFound(found);renderTray(m.id);}
      setTimeout(function(){eggWrap.classList.add("settled");},1100);
    },420);
  }

  /* show an already-collected creature again (from a tray tap) */
  function showMonster(m){
    hatched=true;current=m;
    monsterEl.innerHTML=monsterSvg(m);
    startPersonality(m);
    if(m.idle) monsterEl.setAttribute("data-idle",m.idle);
    else monsterEl.removeAttribute("data-idle");
    eggWrap.classList.add("hatched","settled");
    eggWrap.style.cursor="default";
    eggWrap.setAttribute("aria-label",m.name+" came to visit!");
    glow.style.opacity="1";
    hint.textContent="";
    document.getElementById("monsterName").textContent=m.name;
    document.getElementById("monsterBio").textContent=m.bio;
    document.getElementById("newBadge").hidden=true;
    reveal.classList.add("show");
    ensureAudio();
    if(actx){tone(660,0,0.09,0.14,"triangle");tone(880,0.08,0.14,0.14,"triangle");}
  }

  function resetEgg(){
    stopPersonality();
    hatched=false;taps=0;current=null;
    eggWrap.classList.remove("hatched","settled");
    eggWrap.style.cursor="pointer";
    eggWrap.setAttribute("aria-label","Tap the egg to hatch it");
    monsterEl.innerHTML="";
    glow.style.opacity="0";
    reveal.classList.remove("show");
    [1,2,3].forEach(function(n){document.getElementById("crack"+n).classList.remove("show");});
    hint.textContent="tap the egg";
    hint.classList.remove("solid");
  }

  eggWrap.addEventListener("pointerdown",onTap);
  eggWrap.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){e.preventDefault();onTap();}
  });
  document.getElementById("again").addEventListener("click",function(){
    ensureAudio();
    tone&&actx&&tone(660,0,0.1,0.15,"triangle");
    resetEgg();
  });
})();
</script>

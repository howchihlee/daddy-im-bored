<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#121826" />
  <title>注音王</title>
  <style>
    :root{
      --bg1:#0f172a;--bg2:#1e293b;--card:#111827;--card2:#1f2937;
      --text:#f8fafc;--muted:#cbd5e1;--good:#22c55e;--bad:#ef4444;
      --soft:#334155;--blue:#60a5fa;--shadow:0 14px 34px rgba(0,0,0,.35);
      --border:#475569;--gold:#fbbf24;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;padding:18px;
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text);
      display:flex;align-items:center;justify-content:center;
    }
    .app{
      width:min(760px,100%);background:rgba(17,24,39,.95);border-radius:28px;
      box-shadow:var(--shadow);padding:28px;text-align:center;border:2px solid #334155;
    }
    h1{margin:0 0 22px;font-size:clamp(30px,6vw,50px);color:#fff}
    .question-card{
      background:#1e293b;border:3px solid var(--gold);border-radius:26px;
      padding:18px 20px 20px;margin:0 auto 24px;max-width:360px;box-shadow:0 7px 0 #92400e;
    }
    .question-label{color:#fde68a;font-size:18px;font-weight:900;margin-bottom:10px}
    #questionBtn{
      width:100%;min-height:72px;border:0;border-radius:18px;background:#334155;color:#fff;
      cursor:pointer;font-size:clamp(42px,10vw,58px);line-height:1;box-shadow:0 4px 0 #0f172a;
      -webkit-tap-highlight-color:transparent;transition:.12s;
    }
    #questionBtn:hover{background:#3f4d63;transform:translateY(-2px)}
    #questionBtn:active{transform:translateY(3px);box-shadow:none}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .choice{
      min-height:190px;border:3px solid var(--border);border-radius:24px;background:var(--card2);
      color:#fff;font-size:clamp(62px,14vw,104px);font-weight:700;cursor:pointer;transition:.15s;
      display:flex;align-items:center;justify-content:center;user-select:none;-webkit-tap-highlight-color:transparent;
      font-family:"DFKai-SB","BiauKai","Noto Serif TC","Microsoft JhengHei",sans-serif;
    }
    .choice:hover{transform:translateY(-3px);border-color:#93c5fd;background:#243244}
    .choice.correct{background:#052e16;border-color:var(--good)}
    .choice.wrong{background:#450a0a;border-color:var(--bad)}
    .controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
    .control-btn{border:none;color:#0f172a;font-size:18px;font-weight:900;border-radius:16px;padding:12px 18px;cursor:pointer}
    #nextBtn{background:var(--blue);box-shadow:0 5px 0 #2563eb;font-size:28px;padding:18px 36px;width:min(360px,100%);min-height:72px}
    #soundBtn{background:#6b7280;color:#fff;box-shadow:0 5px 0 #374151}
    .control-btn:active{transform:translateY(3px);box-shadow:none!important}
    .scorebar{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
    .pill{background:var(--soft);color:#fff;border-radius:999px;padding:10px 16px;font-weight:800;font-size:17px;border:1px solid #475569}
    #message{min-height:48px;margin:21px 0 4px;font-size:25px;font-weight:900;line-height:1.5;color:#fff}
    .hint{color:var(--muted);font-size:14px;margin-top:7px}
    @media (max-width:560px){
      body{padding:10px}.app{padding:20px 14px;border-radius:22px}.choices{gap:12px}
      .choice{min-height:150px}.question-card{max-width:300px;padding:15px}
      #questionBtn{min-height:64px}
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>🌟 注音王 🌟</h1>

    <section class="question-card" aria-label="聲音題目">
      <div class="question-label">聽聲音，選出正確注音</div>
      <button id="questionBtn" type="button" aria-label="播放題目聲音" title="播放題目聲音">🔊</button>
    </section>

    <section class="choices" aria-label="選擇答案">
      <button class="choice" id="choiceA" type="button"></button>
      <button class="choice" id="choiceB" type="button"></button>
    </section>

    <div class="controls">
      <button id="nextBtn" class="control-btn" type="button">換一題</button>
    </div>
    <div class="scorebar">
      <div class="pill" aria-live="polite">答對: <span id="score">0</span></div>
      <button id="soundBtn" class="control-btn" type="button" aria-label="關閉答題音效" title="關閉答題音效">答題音效 🔊</button>
    </div>
    <div class="hint">37 個注音符號隨機出題・每題二選一</div>
    <div id="message" aria-live="polite"></div>
  </main>

const choiceA=document.getElementById("choiceA");
const choiceB=document.getElementById("choiceB");
const questionBtn=document.getElementById("questionBtn");
const message=document.getElementById("message");
const scoreEl=document.getElementById("score");
const nextBtn=document.getElementById("nextBtn");
const soundBtn=document.getElementById("soundBtn");

let answer=null;
let score=0;
let locked=false;
let feedbackSoundOn=true;
let lastWrongSoundIndex=-1;
let lastAnswerSymbol=null;

const questionAudio=new Audio();
questionAudio.preload="auto";
questionAudio.volume=1;
const wrongAudio=new Audio();
wrongAudio.preload="auto";
wrongAudio.volume=0.8;
correctAudio.preload="auto";
correctAudio.volume=0.9;

function stopAudio(audio){
  audio.pause();
  try{audio.currentTime=0;}catch(e){}
}
function stopFeedbackSounds(){stopAudio(correctAudio);stopAudio(wrongAudio);}
function stopQuestionSound(){stopAudio(questionAudio);}

function playQuestion(){
  if(!answer)return;
  stopFeedbackSounds();
  stopQuestionSound();
  questionAudio.src=answer.src;
  const p=questionAudio.play();
  if(p)p.catch(()=>{});
}

function playCorrectSound(){
  if(!feedbackSoundOn)return;
  stopAudio(wrongAudio);stopAudio(correctAudio);
  const p=correctAudio.play();if(p)p.catch(()=>{});
}
function playWrongSound(){
  if(!feedbackSoundOn)return;
  stopAudio(correctAudio);stopAudio(wrongAudio);
  const choices=wrongSoundTracks.map((_,i)=>i).filter(i=>i!==lastWrongSoundIndex);
  const index=choices[Math.floor(Math.random()*choices.length)];
  lastWrongSoundIndex=index;
  wrongAudio.src=wrongSoundTracks[index].src;
  const p=wrongAudio.play();if(p)p.catch(()=>{});
}

function randomIndex(exclude=-1){
  let i;
  do{i=Math.floor(Math.random()*bopomofoAudio.length);}while(i===exclude && bopomofoAudio.length>1);
  return i;
}

function newQuestion(autoplay=true){
  locked=false;
  stopQuestionSound();
  stopFeedbackSounds();
  choiceA.className="choice";
  choiceB.className="choice";

  // Avoid repeating the same correct symbol twice in a row when possible.
  let correctIndex;
  do{correctIndex=randomIndex();}while(bopomofoAudio[correctIndex][0]===lastAnswerSymbol && bopomofoAudio.length>1);
  const wrongIndex=randomIndex(correctIndex);
  const correct={symbol:bopomofoAudio[correctIndex][0],src:bopomofoAudio[correctIndex][1]};
  const wrong={symbol:bopomofoAudio[wrongIndex][0],src:bopomofoAudio[wrongIndex][1]};
  answer=correct;
  lastAnswerSymbol=correct.symbol;

  const pair=Math.random()<0.5?[correct,wrong]:[wrong,correct];
  choiceA.textContent=pair[0].symbol;
  choiceB.textContent=pair[1].symbol;
  message.textContent="";

  if(autoplay)playQuestion();
}

function choose(btn){
  if(locked)return;
  locked=true;
  stopQuestionSound();
  if(btn.textContent===answer.symbol){
    btn.classList.add("correct");
    message.textContent="🎉 答對了！好棒！";
    score++;
    scoreEl.textContent=score;
    playCorrectSound();
  }else{
    btn.classList.add("wrong");
    const correctBtn=choiceA.textContent===answer.symbol?choiceA:choiceB;
    correctBtn.classList.add("correct");
    message.textContent="💨 答錯囉！正確答案是「"+answer.symbol+"」";
    playWrongSound();
  }
}

choiceA.addEventListener("click",()=>choose(choiceA));
choiceB.addEventListener("click",()=>choose(choiceB));
questionBtn.addEventListener("click",playQuestion);
nextBtn.addEventListener("click",()=>newQuestion(true));

soundBtn.addEventListener("click",()=>{
  feedbackSoundOn=!feedbackSoundOn;
  if(!feedbackSoundOn)stopFeedbackSounds();
  soundBtn.textContent=feedbackSoundOn?"答題音效 🔊":"答題音效 🔇";
  soundBtn.setAttribute("aria-label",feedbackSoundOn?"關閉答題音效":"開啟答題音效");
  soundBtn.title=feedbackSoundOn?"關閉答題音效":"開啟答題音效";
});

// First question is prepared immediately. Autoplay may be blocked by a browser until the first tap;
// the large speaker button always allows replay.
newQuestion(true);
</script>
